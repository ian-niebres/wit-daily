  <text x="585" y="166" fill="#22283a" font-family="monospace" font-size="20">productivity aura</text>
  <text x="585" y="204" fill="#d13f5f" font-family="monospace" font-size="20">MAY CONTAIN GHOSTS</text>
  <path d="M480 212 C535 238 528 308 600 312 S735 282 792 336" fill="none" stroke="#22283a" stroke-width="16" stroke-linecap="round"/>
  <path d="M480 212 C535 238 528 308 600 312 S735 282 792 336" fill="none" stroke="#6b7cff" stroke-width="6" stroke-dasharray="18 14" stroke-linecap="round"/>
  <rect x="540" y="332" width="296" height="96" rx="18" fill="#d9f7ff" stroke="#22283a" stroke-width="5"/>
  <text x="570" y="372" fill="#22283a" font-family="monospace" font-size="23">AGENT SKILL STACK</text>
