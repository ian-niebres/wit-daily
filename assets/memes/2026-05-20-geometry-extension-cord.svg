<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Geometry conjecture captured by a haunted extension</title>
  <desc id="desc">A fake terminal shows math, plugins, and agents being routed through a suspicious extension cord.</desc>
  <rect width="960" height="540" fill="#10131f"/>
  <rect x="36" y="34" width="892" height="468" rx="28" fill="#f6efe1" stroke="#22283a" stroke-width="8"/>
  <rect x="70" y="72" width="410" height="250" rx="18" fill="#182033"/>
  <text x="96" y="112" fill="#93f5c8" font-family="monospace" font-size="24">OPENAI_GEOM.EXE</text>
  <text x="96" y="154" fill="#f6efe1" font-family="monospace" font-size="22">conjecture: DISPROVED</text>
  <text x="96" y="196" fill="#ffcf6e" font-family="monospace" font-size="22">math morale: -17%</text>
  <path d="M110 262 L190 210 L272 258 L360 180 L438 238" fill="none" stroke="#ff6b8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="360" cy="180" r="14" fill="#ff6b8a"/>
