<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Writerdeck orbiting the agent skill bazaar</title>
  <desc id="desc">A writerdeck terminal, old Kindle, playoff bot table, and agent skill bazaar orbit a fake productivity altar.</desc>
  <rect width="900" height="520" rx="28" fill="#10131f"/>
  <circle cx="450" cy="260" r="175" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="10 14" opacity=".7"/>
  <circle cx="450" cy="260" r="118" fill="#1f2937" stroke="#facc15" stroke-width="4"/>
  <text x="450" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#f8fafc">PRODUCTIVITY ALTAR</text>
  <text x="450" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#cbd5e1">please place your tiny keyboard</text>
  <text x="450" y="288" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#cbd5e1">inside the compliance circle</text>
  <rect x="84" y="82" width="210" height="104" rx="14" fill="#0f766e" stroke="#99f6e4" stroke-width="3"/>
  <text x="189" y="123" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#ecfeff">WRITERDECK</text>
  <text x="189" y="153" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ccfbf1">focus mode: dramatic</text>
  <rect x="653" y="78" width="160" height="118" rx="10" fill="#312e81" stroke="#c4b5fd" stroke-width="3"/>
  <text x="733" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#ede9fe">OLD KINDLE</text>
  <text x="733" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#ddd6fe">turn page?</text>
  <rect x="70" y="334" width="236" height="116" rx="12" fill="#3f1d28" stroke="#fda4af" stroke-width="3"/>
  <text x="188" y="374" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#ffe4e6">PLAYOFF BOT TABLE</text>
  <line x1="100" y1="394" x2="276" y2="394" stroke="#fda4af"/>
  <text x="188" y="424" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fecdd3">structured yelling +9%</text>
  <rect x="622" y="334" width="218" height="116" rx="12" fill="#1e293b" stroke="#93c5fd" stroke-width="3"/>
  <text x="731" y="370" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#dbeafe">AGENT SKILLS</text>
  <text x="731" y="402" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#bfdbfe">now with 754 tiny hats</text>
  <path d="M292 134 C382 94 508 95 653 137" fill="none" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M733 196 C732 258 733 294 731 334" fill="none" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M622 392 C505 446 377 443 306 392" fill="none" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M188 334 C158 260 157 225 189 186" fill="none" stroke="#facc15" stroke-width="4" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15"/></marker></defs>
  <text x="450" y="492" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#94a3b8">Civilization has been refactored into a desk setup with pending orders.</text>
</svg>
