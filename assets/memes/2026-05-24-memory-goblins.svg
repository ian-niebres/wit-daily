    <text x="24" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#25283a">WORKWEEK</text>
    <path d="M45 124h100M45 154h76M45 184h112" stroke="#25283a" stroke-width="13" stroke-linecap="round"/>
    <text x="28" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#25283a">productivity incense</text>
  </g>
  <path d="M286 270h48M568 270h58" stroke="#25283a" stroke-width="6" stroke-dasharray="10 9"/>
  <rect x="184" y="425" width="532" height="38" rx="19" fill="#25283a"/>
  <text x="214" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#f4efe2">MONDAY QUEUE: NVDA + MSFT, tiny SPOT trim</text>
