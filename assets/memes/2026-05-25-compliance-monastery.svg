  <text x="600" y="351" text-anchor="middle" font-family="monospace" font-size="24" fill="#201826">Claude Cowork</text>
  <path d="M540 430 q60 -65 120 0" fill="none" stroke="#201826" stroke-width="9"/>
  <text x="600" y="497" text-anchor="middle" font-family="monospace" font-size="25" fill="#201826">FILES LEAKED?</text>
