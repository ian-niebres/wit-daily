  <text x="935" y="486" text-anchor="middle" font-family="monospace" font-size="23" fill="#201826">VPN MITIGATION</text>
  <text x="935" y="522" text-anchor="middle" font-family="monospace" font-size="20" fill="#201826">now with server incense</text>
