<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Graph goblins unionize a job interview</title>
  <desc id="desc">A satirical control room where knowledge graphs, pixel fonts, prediction markets, and agent taste skills fight over one job interview chair.</desc>
  <rect width="1200" height="720" fill="#fff9ee"/>
  <rect x="34" y="34" width="1132" height="652" rx="22" fill="#171717"/>
  <rect x="64" y="64" width="1072" height="592" rx="16" fill="#fffef8" stroke="#171717" stroke-width="6"/>
  <text x="90" y="122" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#171717">TODAY'S INTERNET CONTROL ROOM</text>
  <rect x="92" y="160" width="430" height="360" fill="#f2c94c" stroke="#171717" stroke-width="5"/>
  <text x="122" y="210" font-family="Arial,sans-serif" font-size="30" font-weight="900">JOB INTERVIEW</text>
  <circle cx="300" cy="348" r="78" fill="#fff" stroke="#171717" stroke-width="5"/>
  <text x="245" y="342" font-family="Arial,sans-serif" font-size="24" font-weight="900">VISIBLE</text>
  <text x="238" y="374" font-family="Arial,sans-serif" font-size="24" font-weight="900">FRUSTRATION</text>
  <rect x="148" y="432" width="318" height="46" fill="#ff5a7a" stroke="#171717" stroke-width="4"/>
  <text x="170" y="464" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#fff">PLEASE EXPLAIN C ARRAYS</text>
  <rect x="610" y="155" width="420" height="220" fill="#15b8c8" stroke="#171717" stroke-width="5"/>
  <text x="638" y="205" font-family="Arial,sans-serif" font-size="30" font-weight="900">KNOWLEDGE GRAPH</text>
  <line x1="700" y1="250" x2="820" y2="285" stroke="#171717" stroke-width="5"/>
  <line x1="820" y1="285" x2="930" y2="235" stroke="#171717" stroke-width="5"/>
  <line x1="700" y1="250" x2="900" y2="330" stroke="#171717" stroke-width="5"/>
  <circle cx="700" cy="250" r="28" fill="#fff" stroke="#171717" stroke-width="5"/>
  <circle cx="820" cy="285" r="28" fill="#fff" stroke="#171717" stroke-width="5"/>
  <circle cx="930" cy="235" r="28" fill="#fff" stroke="#171717" stroke-width="5"/>
  <circle cx="900" cy="330" r="28" fill="#fff" stroke="#171717" stroke-width="5"/>
  <text x="662" y="360" font-family="Arial,sans-serif" font-size="22" font-weight="900">now with taste, memory, and a tiny union rep</text>
  <rect x="610" y="420" width="420" height="115" fill="#35b779" stroke="#171717" stroke-width="5"/>
  <text x="638" y="468" font-family="Arial,sans-serif" font-size="28" font-weight="900">PREDICTION MARKETS</text>
  <text x="638" y="506" font-family="Arial,sans-serif" font-size="24" font-weight="900">BLOCKED BY GAMBLING GOBLIN</text>
  <path d="M535 330 C575 310 575 430 535 415" fill="none" stroke="#171717" stroke-width="7" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#171717"/></marker></defs>
  <text x="104" y="592" font-family="Arial,sans-serif" font-size="34" font-weight="900">FUND RESPONSE: buy cloud closet, trim tollbooth screw</text>
</svg>