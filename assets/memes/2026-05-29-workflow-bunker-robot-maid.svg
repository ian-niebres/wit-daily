<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Workflow bunker with robot maid and SQLite vault</title>
  <desc id="desc">A satirical control room where durable workflows, robot cleaning data, and MCP funeral confetti become market weather.</desc>
  <rect width="900" height="520" fill="#10131f"/>
  <rect x="48" y="42" width="804" height="436" rx="28" fill="#f4ead7" stroke="#1b1f2a" stroke-width="6"/>
  <text x="450" y="92" text-anchor="middle" font-family="monospace" font-size="34" font-weight="700" fill="#1b1f2a">TODAY'S INTERNET OPERATIONS BUNKER</text>
  <g transform="translate(90 130)">
    <rect x="0" y="0" width="255" height="250" rx="18" fill="#d7f0ff" stroke="#1b1f2a" stroke-width="4"/>
    <text x="128" y="42" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#1b1f2a">SQLITE VAULT</text>
    <rect x="50" y="78" width="155" height="110" rx="10" fill="#fff8e8" stroke="#1b1f2a" stroke-width="4"/>
    <circle cx="128" cy="133" r="38" fill="#ffd166" stroke="#1b1f2a" stroke-width="4"/>
    <text x="128" y="142" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#1b1f2a">BEGIN;</text>
    <text x="128" y="222" text-anchor="middle" font-family="monospace" font-size="17" fill="#1b1f2a">durable workflows</text>
  </g>
  <g transform="translate(372 130)">
    <rect x="0" y="0" width="185" height="250" rx="18" fill="#eadcff" stroke="#1b1f2a" stroke-width="4"/>
    <text x="92" y="42" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#1b1f2a">MCP</text>
    <path d="M50 92 h85 v95 h-85 z" fill="#2d3142"/>
    <path d="M42 187 h101 v22 h-101 z" fill="#1b1f2a"/>
    <text x="92" y="124" text-anchor="middle" font-family="monospace" font-size="18" fill="#f4ead7">RIP</text>
    <text x="92" y="151" text-anchor="middle" font-family="monospace" font-size="15" fill="#f4ead7">PROTOCOL</text>
    <text x="92" y="224" text-anchor="middle" font-family="monospace" font-size="16" fill="#1b1f2a">funeral takes</text>
  </g>
  <g transform="translate(584 130)">
    <rect x="0" y="0" width="225" height="250" rx="18" fill="#d8ffd6" stroke="#1b1f2a" stroke-width="4"/>
    <text x="112" y="42" text-anchor="middle" font-family="monospace" font-size="22" font-weight="700" fill="#1b1f2a">ROBOT MAID</text>
    <circle cx="112" cy="92" r="30" fill="#ffffff" stroke="#1b1f2a" stroke-width="4"/>
    <rect x="76" y="122" width="72" height="76" rx="16" fill="#ffffff" stroke="#1b1f2a" stroke-width="4"/>
    <path d="M72 204 q40 30 82 0" fill="none" stroke="#1b1f2a" stroke-width="5"/>
    <circle cx="101" cy="88" r="5" fill="#1b1f2a"/><circle cx="123" cy="88" r="5" fill="#1b1f2a"/>
    <text x="112" y="224" text-anchor="middle" font-family="monospace" font-size="16" fill="#1b1f2a">dust = training data</text>
  </g>
  <path d="M310 405 C430 445 500 445 620 405" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 16"/>
  <text x="450" y="456" text-anchor="middle" font-family="monospace" font-size="24" font-weight="700" fill="#1b1f2a">MARKET SIGNAL: BUY A SMALLER PANIC ROOM</text>
</svg>