<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Fingerprint lobby with a netbook and agent goblin</title>
  <desc id="desc">A satirical login lobby where a CAPTCHA scans a tiny netbook while an agent goblin asks for sudo.</desc>
  <rect width="900" height="520" fill="#111827"/>
  <rect x="38" y="38" width="824" height="444" rx="28" fill="#f8fafc" stroke="#38bdf8" stroke-width="6"/>
  <text x="70" y="92" font-family="monospace" font-size="30" font-weight="700" fill="#0f172a">WELCOME TO THE INTERNET LOBBY</text>
  <text x="70" y="128" font-family="monospace" font-size="16" fill="#475569">please prove you are not a spreadsheet wearing shoes</text>

  <rect x="74" y="170" width="270" height="210" rx="18" fill="#dbeafe" stroke="#0f172a" stroke-width="4"/>
  <text x="105" y="210" font-family="monospace" font-size="18" fill="#0f172a">TURNSTILE 9000</text>
  <circle cx="209" cy="286" r="58" fill="none" stroke="#0ea5e9" stroke-width="8"/>
  <path d="M182 286c0-42 54-49 54-4 0 29-20 36-38 47" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <path d="M205 245c38 6 62 43 35 89" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
  <text x="105" y="356" font-family="monospace" font-size="15" fill="#0f172a">WEBGL OR IT DIDN'T HAPPEN</text>

  <g transform="translate(425 175)">
    <rect x="0" y="42" width="210" height="118" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="5"/>
    <rect x="24" y="60" width="162" height="74" rx="8" fill="#bae6fd"/>
    <text x="42" y="104" font-family="monospace" font-size="20" font-weight="700" fill="#0f172a">NETBOOK</text>
    <rect x="-20" y="160" width="250" height="28" rx="8" fill="#64748b"/>
    <circle cx="105" cy="174" r="5" fill="#f8fafc"/>
    <text x="8" y="224" font-family="monospace" font-size="16" fill="#0f172a">small computer, huge feelings</text>
  </g>

  <g transform="translate(670 182)">
    <circle cx="62" cy="62" r="46" fill="#a7f3d0" stroke="#0f172a" stroke-width="4"/>
    <circle cx="47" cy="53" r="5" fill="#0f172a"/><circle cx="77" cy="53" r="5" fill="#0f172a"/>
    <path d="M45 78c16 12 34 12 48 0" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <rect x="18" y="111" width="88" height="102" rx="18" fill="#86efac" stroke="#0f172a" stroke-width="4"/>
    <text x="21" y="238" font-family="monospace" font-size="15" fill="#0f172a">AGENT GOBLIN</text>
  </g>
  <rect x="585" y="132" width="244" height="42" rx="12" fill="#fee2e2" stroke="#0f172a" stroke-width="3"/>
  <text x="604" y="159" font-family="monospace" font-size="18" fill="#991b1b">sudo? just a little?</text>

  <path d="M347 274h55" stroke="#0f172a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M642 273h42" stroke="#0f172a" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/></marker></defs>

  <rect x="82" y="412" width="736" height="36" rx="12" fill="#0f172a"/>
  <text x="104" y="436" font-family="monospace" font-size="16" fill="#f8fafc">STATUS: logged in, fingerprinted, converted to Markdown, emotionally billed monthly</text>
</svg>
