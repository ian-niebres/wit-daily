<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Durable execution panic room with compressed agents</title>
  <desc id="desc">A fake operations room where a database bunker, pocket agents, verification doors, and GPU weather share one dashboard.</desc>
  <rect width="900" height="520" fill="#111827"/>
  <rect x="38" y="38" width="824" height="444" rx="28" fill="#f8fafc" stroke="#0f172a" stroke-width="6"/>
  <text x="450" y="86" text-anchor="middle" font-family="monospace" font-size="30" font-weight="700" fill="#0f172a">INTERNET OPS PANIC ROOM</text>
  <text x="450" y="116" text-anchor="middle" font-family="monospace" font-size="15" fill="#64748b">durable execution • compressed agents • verification furniture</text>

  <g transform="translate(80 150)">
    <rect width="220" height="250" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <rect x="34" y="42" width="152" height="122" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M34 75h152M34 108h152M34 141h152" stroke="#93c5fd" stroke-width="4"/>
    <text x="110" y="202" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#1e3a8a">pg_durable</text>
    <text x="110" y="228" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e40af">database bunker</text>
  </g>

  <g transform="translate(340 150)">
    <rect width="220" height="250" rx="18" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
    <circle cx="72" cy="82" r="34" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
    <circle cx="148" cy="82" r="34" fill="#fde68a" stroke="#92400e" stroke-width="3"/>
    <rect x="52" y="130" width="116" height="54" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="3"/>
    <text x="110" y="158" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#92400e">-95% TOKENS</text>
    <text x="110" y="210" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#92400e">pocket agents</text>
    <text x="110" y="234" text-anchor="middle" font-family="monospace" font-size="15" fill="#b45309">same panic, smaller jar</text>
  </g>

  <g transform="translate(600 150)">
    <rect width="220" height="250" rx="18" fill="#fee2e2" stroke="#be123c" stroke-width="4"/>
    <rect x="50" y="45" width="120" height="132" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="3"/>
    <circle cx="110" cy="114" r="18" fill="#f43f5e"/>
    <path d="M86 114h48" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="110" y="212" text-anchor="middle" font-family="monospace" font-size="20" font-weight="700" fill="#881337">REDDIT DOOR</text>
    <text x="110" y="236" text-anchor="middle" font-family="monospace" font-size="15" fill="#be123c">please wait for vibes</text>
  </g>

  <path d="M300 275h40" stroke="#0f172a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M560 275h40" stroke="#0f172a" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs>

  <rect x="132" y="425" width="636" height="36" rx="18" fill="#0f172a"/>
  <text x="450" y="449" text-anchor="middle" font-family="monospace" font-size="16" fill="#f8fafc">FUND ACTION: buy panic-room landlords, sell lobby fog</text>
</svg>
