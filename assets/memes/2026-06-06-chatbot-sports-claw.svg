<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot sports claw compliance arena</title>
  <desc id="desc">A satirical dashboard where a hacked chatbot, agentic PC, sports scoreboard, and foam claw share one arena.</desc>
  <rect width="900" height="520" fill="#10131f"/>
  <rect x="42" y="42" width="816" height="436" rx="28" fill="#f6e7bd" stroke="#111827" stroke-width="6"/>
  <text x="70" y="92" font-family="monospace" font-size="30" font-weight="700" fill="#111827">PUBLIC MOOD CONTROL PANEL</text>
  <rect x="70" y="120" width="350" height="270" rx="18" fill="#fffaf0" stroke="#111827" stroke-width="4"/>
  <text x="100" y="165" font-family="monospace" font-size="24" fill="#111827">AI CHATBOT</text>
  <circle cx="180" cy="230" r="44" fill="#8bd3ff" stroke="#111827" stroke-width="4"/>
  <circle cx="164" cy="222" r="6" fill="#111827"/><circle cx="196" cy="222" r="6" fill="#111827"/>
  <path d="M160 250 Q180 270 202 250" fill="none" stroke="#111827" stroke-width="5"/>
  <rect x="252" y="190" width="122" height="86" rx="12" fill="#ff8ba7" stroke="#111827" stroke-width="4"/>
  <text x="270" y="225" font-family="monospace" font-size="17" fill="#111827">LOGIN</text>
  <text x="268" y="251" font-family="monospace" font-size="17" fill="#111827">GREMLIN</text>
  <path d="M224 230 L252 230" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="480" y="120" width="330" height="270" rx="18" fill="#e9f7ef" stroke="#111827" stroke-width="4"/>
  <text x="510" y="165" font-family="monospace" font-size="24" fill="#111827">AGENTIC PC</text>
  <rect x="535" y="195" width="130" height="95" rx="10" fill="#cdb4db" stroke="#111827" stroke-width="4"/>
  <text x="554" y="232" font-family="monospace" font-size="16" fill="#111827">RUNS</text>
  <text x="552" y="257" font-family="monospace" font-size="16" fill="#111827">CHROMIUM</text>
  <path d="M700 205 C760 220 760 280 690 305 L675 275 C710 260 710 240 675 234 Z" fill="#ffd166" stroke="#111827" stroke-width="4"/>
  <text x="690" y="258" font-family="monospace" font-size="18" fill="#111827" transform="rotate(10 690 258)">THE CLAW</text>
  <rect x="165" y="420" width="570" height="36" rx="18" fill="#111827"/>
  <text x="192" y="444" font-family="monospace" font-size="18" fill="#f6e7bd">STATUS: everything is sports, security, or a memory palace</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
</svg>