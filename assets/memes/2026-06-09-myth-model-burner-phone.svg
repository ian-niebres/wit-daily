<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">The myth model asks compliance for a burner phone</title>
  <desc id="desc">A fake incident board connecting a myth-branded model launch, phone ID paperwork, agent grep, and hardware hackathon solder smoke.</desc>
  <rect width="1100" height="620" rx="32" fill="#111827"/>
  <rect x="38" y="38" width="1024" height="544" rx="28" fill="#f8fafc"/>
  <text x="78" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="800" fill="#111827">PUBLIC MOOD INCIDENT BOARD</text>
  <text x="80" y="132" font-family="ui-sans-serif, system-ui" font-size="18" fill="#64748b">case file: model launch anxiety + paperwork weather</text>
  <g font-family="ui-sans-serif, system-ui" font-weight="700" text-anchor="middle">
    <rect x="78" y="178" width="245" height="132" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="200" y="230" font-size="24" fill="#991b1b">MYTH MODEL</text><text x="200" y="264" font-size="18" fill="#991b1b">licensed to haunt rivals</text>
    <rect x="430" y="164" width="245" height="152" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <text x="552" y="224" font-size="24" fill="#1e3a8a">BURNER PHONE</text><text x="552" y="258" font-size="18" fill="#1e3a8a">now wants ID</text>
