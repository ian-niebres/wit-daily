    <text x="904" y="230" font-size="24" fill="#14532d">AGENT GREP</text><text x="904" y="264" font-size="18" fill="#14532d">finds the vibes</text>
    <rect x="256" y="384" width="245" height="126" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
    <text x="378" y="433" font-size="24" fill="#92400e">SOLDER FUMES</text><text x="378" y="466" font-size="18" fill="#92400e">hackathon DLC</text>
