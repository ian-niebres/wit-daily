  <g stroke="#334155" stroke-width="5" stroke-linecap="round" opacity=".8"><path d="M323 238 C370 210 388 210 430 226"/><path d="M675 236 C720 214 744 214 782 236"/><path d="M513 316 C470 350 432 368 403 384"/><path d="M592 316 C640 352 681 370 706 384"/><path d="M501 447 H606"/></g>
