<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Tiny intern mall converts a park into a data center</title>
  <desc id="desc">A satirical diagram showing agent skill kiosks, HTML-first nostalgia, Fable guardrails, and sports search confetti feeding into a data center mall.</desc>
  <rect width="900" height="520" rx="28" fill="#10131f"/>
  <rect x="44" y="42" width="812" height="436" rx="24" fill="#f6eddc" stroke="#22283a" stroke-width="8"/>
  <text x="450" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" font-weight="700" fill="#172033">PUBLIC MOOD REZONING HEARING</text>
  <rect x="86" y="128" width="235" height="250" rx="18" fill="#cde7ff" stroke="#172033" stroke-width="4"/>
  <text x="204" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">PARKLAND</text>
  <circle cx="148" cy="248" r="38" fill="#6fcf97" stroke="#172033" stroke-width="4"/>
  <circle cx="238" cy="230" r="34" fill="#6fcf97" stroke="#172033" stroke-width="4"/>
  <rect x="115" y="306" width="170" height="34" rx="17" fill="#7bd389" stroke="#172033" stroke-width="3"/>
  <text x="202" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">donated vibes</text>
  <path d="M330 252 C386 208 430 208 488 252" fill="none" stroke="#e4572e" stroke-width="10" marker-end="url(#arrow)"/>
  <text x="410" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e4572e">REZONED BY DISCOURSE</text>
  <rect x="506" y="128" width="305" height="250" rx="18" fill="#fff" stroke="#172033" stroke-width="4"/>
  <text x="659" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">TINY INTERN MALL</text>
  <rect x="540" y="196" width="82" height="56" rx="10" fill="#ffd166" stroke="#172033" stroke-width="3"/>
  <text x="581" y="230" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">SKILLS</text>
  <rect x="640" y="196" width="82" height="56" rx="10" fill="#b8f2e6" stroke="#172033" stroke-width="3"/>
  <text x="681" y="230" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">FABLE</text>
  <rect x="590" y="272" width="82" height="56" rx="10" fill="#ffcad4" stroke="#172033" stroke-width="3"/>
  <text x="631" y="306" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">HTML</text>
  <rect x="690" y="272" width="82" height="56" rx="10" fill="#cdb4db" stroke="#172033" stroke-width="3"/>
  <text x="731" y="306" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#172033">VM</text>
  <text x="659" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">now with parking for 1.8 GB of feelings</text>
  <rect x="116" y="26" width="160" height="38" rx="19" fill="#e4572e"/>
  <text x="196" y="51" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">HN COMMITTEE</text>
  <rect x="604" y="26" width="180" height="38" rx="19" fill="#2d6cdf"/>
  <text x="694" y="51" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#fff">GITHUB FOOD COURT</text>
  <text x="450" y="460" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#172033">Verdict: approve, pending Knicks tipoff and quote-source 404.</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e4572e"/></marker></defs>
</svg>
