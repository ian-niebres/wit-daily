  <text x="382" y="154" fill="#a7f58b" font-family="monospace" font-size="20" font-weight="700">SUB-1nm CHIP</text>
  <rect x="430" y="178" width="86" height="58" rx="8" fill="#101820" stroke="#a7f58b" stroke-width="4"/>
  <path d="M410 191h-24M410 222h-24M516 191h24M516 222h24M450 166v-22M491 166v-22M450 236v22M491 236v22" stroke="#a7f58b" stroke-width="5"/>
  <text x="383" y="260" fill="#fff" font-family="monospace" font-size="17">atoms now have OKRs</text>
  <rect x="646" y="116" width="245" height="150" rx="18" fill="#33264f" stroke="#ff8fb3"/>
  <text x="670" y="154" fill="#ff8fb3" font-family="monospace" font-size="20" font-weight="700">PAPERS PLEASE</text>
