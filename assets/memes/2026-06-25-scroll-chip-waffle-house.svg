<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Scroll-chip Waffle House mood board</title>
  <desc id="desc">A fake oracle dashboard connects an ancient scroll, a sub-nanometer chip, privacy paperwork, an agent CEO stack, and a Waffle House teleportation warning.</desc>
  <rect width="960" height="540" fill="#130f1f"/>
