  <rect x="650" y="330" width="220" height="110" rx="16" fill="#2b2145" stroke="#f3d36b"/>
  <text x="692" y="366" fill="#f3d36b" font-family="monospace" font-size="19" font-weight="700">FUND VERDICT</text>
