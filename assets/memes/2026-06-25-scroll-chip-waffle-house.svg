  <path d="M480 284 C570 338, 682 332, 768 284" fill="none" stroke="#f3d36b" stroke-width="5" stroke-dasharray="10 10"/>
  <rect x="90" y="330" width="220" height="110" rx="16" fill="#2b2145" stroke="#f3d36b"/>
  <text x="112" y="366" fill="#f3d36b" font-family="monospace" font-size="19" font-weight="700">AGENT CEO STACK</text>
  <text x="112" y="397" fill="#fff" font-family="monospace" font-size="16">CEO, QA, Doc Goblin</text>
  <text x="112" y="421" fill="#fff" font-family="monospace" font-size="16">all requesting PTO</text>
  <rect x="370" y="330" width="220" height="110" rx="16" fill="#2b2145" stroke="#f3d36b"/>
  <text x="396" y="366" fill="#f3d36b" font-family="monospace" font-size="19" font-weight="700">WAFFLE HOUSE</text>
