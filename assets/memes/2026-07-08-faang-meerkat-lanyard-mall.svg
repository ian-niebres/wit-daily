  <text x="122" y="324" font-family="Arial, sans-serif" font-size="24" fill="#171717">promotion packet DLC</text>
  <rect x="456" y="200" width="295" height="160" rx="18" fill="#f2c94c" stroke="#171717" stroke-width="6"/>
