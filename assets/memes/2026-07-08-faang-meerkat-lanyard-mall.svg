  <rect width="1200" height="720" fill="#fff9ee"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="8" dy="8" stdDeviation="0" flood-color="#171717" flood-opacity="1"/></filter>
  </defs>
