  <text x="838" y="324" font-family="Arial, sans-serif" font-size="24" fill="#171717">with binoculars</text>
  <path d="M393 280 C420 270 430 270 456 280" stroke="#171717" stroke-width="7" fill="none" marker-end="url(#arrow)"/>
  <path d="M751 280 C778 270 788 270 814 280" stroke="#171717" stroke-width="7" fill="none"/>
  <rect x="132" y="430" width="936" height="150" rx="20" fill="#ffffff" stroke="#171717" stroke-width="6"/>
  <line x1="190" y1="470" x2="1010" y2="470" stroke="#171717" stroke-width="5"/>
  <circle cx="245" cy="470" r="24" fill="#ff5a7a" stroke="#171717" stroke-width="5"/>
  <circle cx="472" cy="470" r="24" fill="#15b8c8" stroke="#171717" stroke-width="5"/>
  <circle cx="704" cy="470" r="24" fill="#f2c94c" stroke="#171717" stroke-width="5"/>
