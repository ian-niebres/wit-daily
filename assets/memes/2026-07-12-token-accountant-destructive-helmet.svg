<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Token accountant with a destructive-command helmet</title>
<desc id="desc">A satirical dashboard where token overhead, command guards, offline survival computers, AI hedge funds, and Odyssey streaming discourse collide.</desc>
<rect width="1200" height="760" fill="#fff9ee"/>
