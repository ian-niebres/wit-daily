<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Pocket TTS monk versus monitor poltergeist</title>
  <desc id="desc">A satirical operations board showing proof thunder, a tiny speech monk, a haunted monitor, an IndieWeb hut, and a weekend hedge fund ticket.</desc>
  <rect width="960" height="540" fill="#10131f"/>
  <rect x="34" y="34" width="892" height="472" rx="28" fill="#f6efe2" stroke="#111827" stroke-width="6"/>
  <text x="480" y="78" text-anchor="middle" font-family="monospace" font-size="30" font-weight="700" fill="#111827">WEEKEND INTERNET OPERATIONS BOARD</text>
  <g transform="translate(70 112)">
    <rect width="230" height="150" rx="18" fill="#dbeafe" stroke="#111827" stroke-width="4"/>
    <text x="115" y="32" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700">POCKET TTS MONK</text>
    <circle cx="115" cy="75" r="26" fill="#facc15" stroke="#111827" stroke-width="4"/>
    <rect x="83" y="101" width="64" height="30" rx="8" fill="#7c3aed"/>
    <text x="115" y="121" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">&lt;500kb</text>
  </g>
  <g transform="translate(365 110)">
    <path d="M30 95 C70 10, 145 10, 185 95 Z" fill="#c4b5fd" stroke="#111827" stroke-width="4"/>
    <text x="108" y="75" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700">PROOF</text>
    <text x="108" y="98" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700">THUNDER</text>
    <path d="M100 103 l-24 60 h34 l-18 56 l58-82 h-38 l22-34z" fill="#f97316" stroke="#111827" stroke-width="3"/>
  </g>
  <g transform="translate(660 108)">
    <rect width="210" height="150" rx="14" fill="#111827" stroke="#111827" stroke-width="4"/>
    <rect x="18" y="20" width="174" height="92" rx="8" fill="#86efac"/>
    <text x="105" y="52" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700" fill="#111827">MONITOR</text>
    <text x="105" y="78" text-anchor="middle" font-family="monospace" font-size="14" fill="#111827">installing vibes...</text>
    <path d="M67 126 h76 l17 18 h-110z" fill="#374151"/>
    <text x="105" y="172" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" fill="#111827">CONSENT: ???</text>
  </g>
  <g transform="translate(95 330)">
    <rect x="0" y="50" width="170" height="85" rx="10" fill="#fde68a" stroke="#111827" stroke-width="4"/>
    <path d="M-8 53 L85 0 L178 53 Z" fill="#f97316" stroke="#111827" stroke-width="4"/>
    <text x="85" y="88" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700">INDIEWEB</text>
    <text x="85" y="112" text-anchor="middle" font-family="monospace" font-size="16">$0.01/day</text>
  </g>
  <g transform="translate(375 330)">
    <rect width="230" height="136" rx="16" fill="#fee2e2" stroke="#111827" stroke-width="4"/>
    <text x="115" y="35" text-anchor="middle" font-family="monospace" font-size="18" font-weight="700">WORLD CUP</text>
    <text x="115" y="61" text-anchor="middle" font-family="monospace" font-size="16">bronze weather</text>
    <path d="M55 92 h120" stroke="#111827" stroke-width="4"/>
    <path d="M55 92 l28 -28 M55 92 l28 28 M175 92 l-28 -28 M175 92 l-28 28" stroke="#111827" stroke-width="4" fill="none"/>
  </g>
  <g transform="translate(700 328)">
    <rect width="170" height="136" rx="16" fill="#dcfce7" stroke="#111827" stroke-width="4"/>
    <text x="85" y="35" text-anchor="middle" font-family="monospace" font-size="17" font-weight="700">FUND TICKET</text>
    <text x="85" y="68" text-anchor="middle" font-family="monospace" font-size="15">MONDAY</text>
    <text x="85" y="95" text-anchor="middle" font-family="monospace" font-size="15">GOOGL + LOGI</text>
    <text x="85" y="119" text-anchor="middle" font-family="monospace" font-size="15">trim CRM</text>
  </g>
  <path d="M300 188 C342 178,342 178,374 188" stroke="#111827" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M578 188 C618 178,618 178,658 188" stroke="#111827" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M265 394 C320 348,320 348,375 394" stroke="#111827" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/></marker></defs>
</svg>
