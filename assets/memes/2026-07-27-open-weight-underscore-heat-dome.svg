  <text x="505" y="280" text-anchor="middle" font-family="monospace" font-size="58" fill="#ff7fa7">_</text>
  <text x="505" y="330" text-anchor="middle" font-family="monospace" font-size="19" fill="#f5f7ff">missing</text>
  <path d="M180 450 H580" stroke="#87f7ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M250 420 v60 M505 420 v60" stroke="#87f7ff" stroke-width="4"/>
  <text x="380" y="505" text-anchor="middle" font-family="monospace" font-size="25" fill="#c9fff8">ruling: vibes admitted</text>
  <rect x="735" y="315" width="350" height="230" rx="24" fill="#1f2b2d" stroke="#9df17f" stroke-width="4"/>
