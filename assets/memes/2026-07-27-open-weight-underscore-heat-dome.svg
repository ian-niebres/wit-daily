  <path d="M840 460 C840 405 980 405 980 460 L980 505 C950 480 930 525 910 500 C890 525 870 480 840 505 Z" fill="#d7fff7" opacity="0.9"/>
  <circle cx="885" cy="455" r="8" fill="#14131f"/><circle cx="935" cy="455" r="8" fill="#14131f"/>
  <rect x="720" y="575" width="395" height="62" rx="16" fill="#2a2039" stroke="#f7d774" stroke-width="3"/>
  <text x="918" y="615" text-anchor="middle" font-family="monospace" font-size="22" fill="#f7d774">BASEBALL TAROT: 42ND BIRTHDAY</text>
  <path d="M660 300 C760 260 805 205 850 185" fill="none" stroke="#ff7fa7" stroke-width="5" stroke-dasharray="10 12"/>
  <text x="600" y="90" text-anchor="middle" font-family="monospace" font-size="34" fill="#f5f7ff">THE INTERNET REQUESTS A CONTINUANCE</text>
