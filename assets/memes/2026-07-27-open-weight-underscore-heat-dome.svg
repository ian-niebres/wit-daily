  <text x="940" y="178" text-anchor="middle" font-family="monospace" font-size="32" fill="#21130a" font-weight="700">DOME</text>
  <rect x="95" y="120" width="570" height="420" rx="28" fill="#23243a" stroke="#87f7ff" stroke-width="4"/>
  <text x="380" y="175" text-anchor="middle" font-family="monospace" font-size="36" fill="#f5f7ff" font-weight="700">COURT OF INTERNET</text>
  <rect x="150" y="225" width="200" height="150" rx="14" fill="#332a52" stroke="#f7d774" stroke-width="3"/>
