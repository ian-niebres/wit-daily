<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Open-weight courthouse heat dome meme</title>
  <desc id="desc">A satirical weather-courtroom dashboard where open-weight models, a missing underscore, garbage collection, and heat dome baseball tarot collide.</desc>
