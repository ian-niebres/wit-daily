<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Cloud agent kennel and Itanium rhino meme</title>
  <desc id="desc">A fake procurement kennel where cloud agents chase a prompt left in a travel guide while an Itanium rhino blocks the door.</desc>
  <rect width="1000" height="620" fill="#fff9ee"/>
  <rect x="28" y="28" width="944" height="564" rx="24" fill="#fffef8" stroke="#171717" stroke-width="8"/>
  <text x="60" y="88" font-family="Georgia,serif" font-size="46" font-weight="700" fill="#171717">TODAY'S INTERNET PROCUREMENT ZOO</text>
  <rect x="60" y="125" width="360" height="330" rx="18" fill="#15b8c8" stroke="#171717" stroke-width="6"/>
  <text x="88" y="170" font-family="Arial,sans-serif" font-size="30" font-weight="900">CLOUD AGENT KENNEL</text>
  <g fill="#ffffff" stroke="#171717" stroke-width="5">
    <rect x="95" y="205" width="115" height="80" rx="12"/>
    <rect x="235" y="205" width="115" height="80" rx="12"/>
    <rect x="165" y="315" width="115" height="80" rx="12"/>
  </g>
  <text x="116" y="253" font-family="Arial,sans-serif" font-size="24" font-weight="900">QA</text>
  <text x="255" y="253" font-family="Arial,sans-serif" font-size="24" font-weight="900">MCP</text>
  <text x="185" y="363" font-family="Arial,sans-serif" font-size="24" font-weight="900">AWS</text>
  <path d="M400 302 C490 245 540 250 610 315" fill="none" stroke="#ff5a7a" stroke-width="10" stroke-linecap="round"/>
  <polygon points="610,315 578,292 580,330" fill="#ff5a7a"/>
  <rect x="555" y="145" width="340" height="245" rx="28" fill="#f2c94c" stroke="#171717" stroke-width="6"/>
  <ellipse cx="730" cy="285" rx="135" ry="72" fill="#ffffff" stroke="#171717" stroke-width="6"/>
  <circle cx="620" cy="245" r="28" fill="#ffffff" stroke="#171717" stroke-width="6"/>
  <path d="M595 230 L548 205 L568 260 Z" fill="#ffffff" stroke="#171717" stroke-width="6"/>
  <text x="650" y="276" font-family="Arial,sans-serif" font-size="34" font-weight="900">ITANIUM</text>
  <text x="660" y="315" font-family="Arial,sans-serif" font-size="26" font-weight="900">RHINO</text>
  <rect x="120" y="470" width="760" height="75" rx="14" fill="#171717"/>
  <text x="150" y="518" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#fff9ee">ERROR: PROMPT LEFT INSIDE TRAVEL GUIDE</text>
  <text x="650" y="430" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#171717">EXPERTISE +12%</text>
  <text x="650" y="462" font-family="Arial,sans-serif" font-size="24" font-weight="900" fill="#171717">DIGNITY -8%</text>
</svg>