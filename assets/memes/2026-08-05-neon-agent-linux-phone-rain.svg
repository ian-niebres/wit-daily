<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Neon agent debugging kiosk in cloud-phishing rain</title>
  <desc id="desc">A fake Blade Runner title-card kiosk where an AI agent holds a Linux phone under cloud-phishing rain while a cat and lynx negotiate a truce.</desc>
  <rect width="1000" height="620" fill="#111827"/>
  <defs><linearGradient id="rain" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <g opacity=".34" stroke="url(#rain)" stroke-width="3">
    <path d="M80 20 L30 180"/><path d="M190 0 L120 220"/><path d="M330 30 L270 250"/><path d="M520 0 L450 260"/><path d="M720 25 L650 260"/><path d="M910 0 L820 280"/>
    <path d="M150 330 L95 590"/><path d="M390 300 L330 610"/><path d="M610 310 L565 610"/><path d="M850 300 L790 610"/>
  </g>
  <rect x="90" y="70" width="820" height="120" rx="18" fill="#0f172a" stroke="#f472b6" stroke-width="5"/>
  <text x="500" y="122" text-anchor="middle" font-family="monospace" font-size="42" fill="#f9a8d4">TITLE CARD WEATHER</text>
  <text x="500" y="164" text-anchor="middle" font-family="monospace" font-size="24" fill="#bae6fd">ENHANCE: AGENT // PHONE // PHISHING</text>
  <rect x="115" y="245" width="250" height="255" rx="18" fill="#172554" stroke="#38bdf8" stroke-width="4"/>
  <text x="240" y="292" text-anchor="middle" font-family="monospace" font-size="24" fill="#e0f2fe">LINUX PHONE</text>
  <rect x="200" y="320" width="80" height="145" rx="16" fill="#020617" stroke="#93c5fd" stroke-width="4"/>
  <circle cx="240" cy="445" r="8" fill="#38bdf8"/><text x="240" y="380" text-anchor="middle" font-family="monospace" font-size="16" fill="#a7f3d0">no apps
only vows</text>
  <rect x="405" y="230" width="245" height="290" rx="24" fill="#312e81" stroke="#c4b5fd" stroke-width="4"/>
  <circle cx="530" cy="315" r="48" fill="#fbbf24"/><rect x="475" y="365" width="110" height="80" rx="18" fill="#fbbf24"/>
  <text x="530" y="475" text-anchor="middle" font-family="monospace" font-size="22" fill="#fef3c7">SELF-IMPROVING
AGENT</text>
  <path d="M655 250 C770 215 855 270 875 350 C895 430 820 505 690 485" fill="#064e3b" stroke="#34d399" stroke-width="4"/>
  <text x="765" y="323" text-anchor="middle" font-family="monospace" font-size="23" fill="#bbf7d0">CLOUD
PHISHING</text>
  <path d="M692 405 q70 -45 140 0" stroke="#bbf7d0" stroke-width="6" fill="none"/>
  <g transform="translate(690 430)"><circle cx="0" cy="0" r="34" fill="#f3f4f6"/><circle cx="95" cy="0" r="46" fill="#d1d5db"/><text x="47" y="80" text-anchor="middle" font-family="monospace" font-size="18" fill="#e5e7eb">CAT / LYNX DETENTE</text></g>
  <path d="M365 365 L405 365" stroke="#f472b6" stroke-width="5"/>
  <text x="500" y="570" text-anchor="middle" font-family="monospace" font-size="26" fill="#fef08a">the spreadsheet bought rain; Stooq sold it a 404</text>
</svg>