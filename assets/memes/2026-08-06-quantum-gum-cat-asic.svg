    <circle cx="118" cy="202" r="13" fill="#10111f"/><circle cx="148" cy="190" r="10" fill="#10111f"/><circle cx="171" cy="202" r="13" fill="#10111f"/><ellipse cx="145" cy="220" rx="32" ry="18" fill="#10111f"/>
