    <rect x="418" y="458" width="148" height="42" rx="18" fill="#334155"/><text x="492" y="485" text-anchor="middle">penguin ID</text>
    <rect x="584" y="458" width="148" height="42" rx="18" fill="#334155"/><text x="658" y="485" text-anchor="middle">scraper fog</text>
  </g>
