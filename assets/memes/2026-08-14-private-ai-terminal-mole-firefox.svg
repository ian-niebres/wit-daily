<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Private AI umbrella over a terminal mole and Firefox sports bar</title>
  <desc id="desc">A fake weather map showing private AI rain, a terminal mole, a browser umbrella, and a sports scoreboard.</desc>
  <rect width="960" height="540" fill="#111827"/>
  <rect x="42" y="42" width="876" height="456" rx="28" fill="#f8fafc" stroke="#0f172a" stroke-width="6"/>
  <text x="76" y="96" font-family="monospace" font-size="30" font-weight="700" fill="#0f172a">TODAY'S INTERNET WEATHER</text>
  <g transform="translate(86 126)">
    <rect x="0" y="0" width="360" height="255" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <path d="M55 100 C95 35, 245 35, 300 100 Z" fill="#2563eb" opacity=".92"/>
    <line x1="178" y1="100" x2="178" y2="198" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <path d="M178 198 q26 24 52 0" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <text x="44" y="142" font-family="monospace" font-size="22" font-weight="700" fill="#0f172a">PRIVATE AI</text>
    <text x="50" y="170" font-family="monospace" font-size="18" fill="#0f172a">homomorphic drizzle</text>
    <circle cx="78" cy="215" r="9" fill="#38bdf8"/><circle cx="132" cy="226" r="9" fill="#38bdf8"/><circle cx="248" cy="216" r="9" fill="#38bdf8"/>
  </g>
  <g transform="translate(520 118)">
    <rect x="0" y="0" width="330" height="148" rx="16" fill="#020617" stroke="#64748b" stroke-width="4"/>
    <text x="24" y="42" font-family="monospace" font-size="20" fill="#22c55e">$ mole --deep-research</text>
    <ellipse cx="165" cy="104" rx="72" ry="32" fill="#78350f"/>
    <circle cx="132" cy="88" r="12" fill="#fbbf24"/><circle cx="198" cy="88" r="12" fill="#fbbf24"/>
    <text x="84" y="132" font-family="monospace" font-size="18" fill="#fde68a">TERMINAL MOLE</text>
  </g>
