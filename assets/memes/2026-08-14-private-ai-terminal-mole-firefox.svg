    <text x="24" y="72" font-family="monospace" font-size="18" fill="#0f172a">uBlock 1 - Ad Fog 0</text>
    <text x="24" y="100" font-family="monospace" font-size="18" fill="#0f172a">LLWS / NFL / tennis tarot</text>
  </g>
  <path d="M448 250 C492 214 518 210 555 194" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M438 316 C486 330 514 342 542 356" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/></marker></defs>
  <text x="82" y="452" font-family="monospace" font-size="22" fill="#334155">Forecast: browser rights, model pageants, huge PRs, tiny agents.</text>
