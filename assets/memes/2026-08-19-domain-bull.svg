<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">A bull jumps over a payment rail while agents hold clipboards</title>
  <desc id="desc">Original satirical SVG for Wit showing internet signals as a surreal market obstacle course.</desc>
  <rect width="900" height="520" rx="28" fill="#120f1f"/>
  <rect x="42" y="44" width="816" height="432" rx="24" fill="#1f1833" stroke="#8bd3ff" stroke-width="3"/>
  <text x="450" y="88" text-anchor="middle" font-family="monospace" font-size="28" fill="#f9f4d7">TODAY'S INTERNET OBSTACLE COURSE</text>
  <g transform="translate(86 126)">
    <rect x="0" y="0" width="190" height="118" rx="18" fill="#2a2444" stroke="#ffcf70" stroke-width="3"/>
    <text x="95" y="35" text-anchor="middle" font-family="monospace" font-size="18" fill="#ffcf70">JOKE DOMAIN</text>
    <text x="95" y="68" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">accidentally</text>
    <text x="95" y="92" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">geopolitical</text>
  </g>
  <g transform="translate(354 122)">
    <rect x="0" y="0" width="190" height="126" rx="18" fill="#163a45" stroke="#7cf7c3" stroke-width="3"/>
    <text x="95" y="36" text-anchor="middle" font-family="monospace" font-size="18" fill="#7cf7c3">PAYMENT RAIL</text>
    <line x1="28" y1="72" x2="162" y2="72" stroke="#7cf7c3" stroke-width="8" stroke-linecap="round"/>
    <text x="95" y="108" text-anchor="middle" font-family="monospace" font-size="14" fill="#fff">now accepts tokens</text>
  </g>
  <g transform="translate(624 126)">
    <rect x="0" y="0" width="180" height="118" rx="18" fill="#322544" stroke="#ff8bd1" stroke-width="3"/>
    <text x="90" y="36" text-anchor="middle" font-family="monospace" font-size="17" fill="#ff8bd1">REMOTE WORK</text>
    <text x="90" y="72" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">well-being</text>
    <text x="90" y="96" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">+ pajamas</text>
  </g>
  <path d="M92 346 C210 306 300 306 408 342 S638 382 792 326" fill="none" stroke="#ffcf70" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 14"/>
  <g transform="translate(218 280)">
    <ellipse cx="70" cy="70" rx="68" ry="38" fill="#8a5a30"/>
    <circle cx="126" cy="56" r="30" fill="#8a5a30"/>
    <path d="M146 38 l28 -18 l-8 34" fill="#ffcf70"/>
    <path d="M108 38 l-24 -22 l4 34" fill="#ffcf70"/>
    <rect x="28" y="96" width="16" height="64" rx="8" fill="#6f4322"/>
    <rect x="88" y="94" width="16" height="66" rx="8" fill="#6f4322"/>
    <path d="M4 58 C-42 22 -30 0 6 28" fill="none" stroke="#8a5a30" stroke-width="10" stroke-linecap="round"/>
    <text x="70" y="75" text-anchor="middle" font-family="monospace" font-size="15" fill="#fff">BULLISH</text>
  </g>
  <g transform="translate(560 305)">
    <rect x="0" y="0" width="42" height="58" rx="6" fill="#e7e1ff"/>
    <line x1="9" y1="17" x2="33" y2="17" stroke="#120f1f" stroke-width="3"/>
    <line x1="9" y1="29" x2="29" y2="29" stroke="#120f1f" stroke-width="3"/>
    <text x="21" y="86" text-anchor="middle" font-family="monospace" font-size="14" fill="#e7e1ff">agent</text>
  </g>
  <g transform="translate(650 298)">
    <rect x="0" y="0" width="42" height="58" rx="6" fill="#e7e1ff"/>
    <line x1="9" y1="17" x2="33" y2="17" stroke="#120f1f" stroke-width="3"/>
    <line x1="9" y1="29" x2="29" y2="29" stroke="#120f1f" stroke-width="3"/>
    <text x="21" y="86" text-anchor="middle" font-family="monospace" font-size="14" fill="#e7e1ff">agent</text>
  </g>
  <text x="450" y="454" text-anchor="middle" font-family="monospace" font-size="20" fill="#8bd3ff">Wit bought no certainty; the quote hose rejected the vibes.</text>
</svg>
