<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Harness paperwork watches a lifeguard rescue the internet from a manhole aurora</title>
  <desc id="desc">A satirical dashboard with agent harness forms, a lifeguard chair, a glowing manhole aurora, and tiny Wi-Fi patience meter.</desc>
  <rect width="1200" height="675" fill="#111827"/>
  <rect x="40" y="40" width="1120" height="595" rx="32" fill="#f7efe3" stroke="#0f172a" stroke-width="6"/>
  <text x="80" y="105" font-family="monospace" font-size="38" font-weight="700" fill="#0f172a">TODAY'S INTERNET INCIDENT BOARD</text>
  <g transform="translate(80 145)">
    <rect width="320" height="410" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <text x="28" y="55" font-family="monospace" font-size="26" font-weight="700" fill="#0f172a">AGENT HARNESS</text>
    <line x1="28" y1="92" x2="292" y2="92" stroke="#94a3b8" stroke-width="4"/>
    <text x="34" y="140" font-family="monospace" font-size="22" fill="#334155">☑ owns nothing</text>
    <text x="34" y="185" font-family="monospace" font-size="22" fill="#334155">☑ cheaper model</text>
    <text x="34" y="230" font-family="monospace" font-size="22" fill="#334155">☑ complex failure</text>
    <text x="34" y="275" font-family="monospace" font-size="22" fill="#334155">☑ Wi-Fi patience</text>
    <rect x="34" y="325" width="250" height="44" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
    <text x="58" y="355" font-family="monospace" font-size="19" font-weight="700" fill="#991b1b">SIGN & PANIC</text>
  </g>
  <g transform="translate(455 142)">
    <rect x="95" y="30" width="120" height="260" fill="#f59e0b" stroke="#0f172a" stroke-width="5"/>
    <rect x="70" y="0" width="170" height="55" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="5"/>
    <text x="90" y="37" font-family="monospace" font-size="25" font-weight="700" fill="#0f172a">LIFEGUARD</text>
    <circle cx="155" cy="355" r="95" fill="#38bdf8" opacity="0.35"/>
    <path d="M35 385 C110 320 205 440 285 365" fill="none" stroke="#0ea5e9" stroke-width="16" stroke-linecap="round"/>
    <text x="20" y="485" font-family="monospace" font-size="24" font-weight="700" fill="#0f172a">situational awareness</text>
  </g>
  <g transform="translate(790 160)">
    <ellipse cx="150" cy="330" rx="145" ry="52" fill="#0f172a"/>
    <ellipse cx="150" cy="318" rx="110" ry="30" fill="#475569"/>
    <path d="M75 250 C90 120 125 90 150 30 C175 100 212 130 225 250" fill="none" stroke="#e0f2fe" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
    <path d="M105 252 C113 160 135 130 150 86 C166 134 188 166 195 252" fill="none" stroke="#a78bfa" stroke-width="14" stroke-linecap="round"/>
    <path d="M130 257 C135 195 144 170 150 135 C158 174 166 198 170 257" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
    <text x="5" y="420" font-family="monospace" font-size="25" font-weight="700" fill="#0f172a">MANHOLE AURORA</text>
  </g>
  <g transform="translate(130 585)">
    <rect width="940" height="32" rx="16" fill="#e5e7eb" stroke="#0f172a" stroke-width="3"/>
    <rect width="610" height="32" rx="16" fill="#86efac"/>
    <text x="965" y="25" font-family="monospace" font-size="20" font-weight="700" fill="#0f172a">PATIENCE 64%</text>
  </g>
</svg>
