<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Accept-header glacier incident board</title>
  <desc id="desc">A fake dashboard where a glacier siren, mainframe, agent markdown request, tailcat packet, and customer-service cat all trigger internet weather.</desc>
  <rect width="1200" height="675" fill="#10131f"/>
  <rect x="40" y="40" width="1120" height="595" rx="28" fill="#f6efe2" stroke="#111827" stroke-width="6"/>
  <text x="80" y="100" font-family="monospace" font-size="34" font-weight="700" fill="#111827">INTERNET WEATHER BOARD // 2026-08-26</text>
  <g transform="translate(80 140)">
    <rect width="315" height="360" rx="22" fill="#b8e0ff" stroke="#111827" stroke-width="5"/>
    <polygon points="40,310 110,110 170,240 225,80 285,310" fill="#e8fbff" stroke="#111827" stroke-width="4"/>
    <path d="M83 220 C145 190 201 210 250 170" fill="none" stroke="#2f80ed" stroke-width="8" stroke-linecap="round"/>
    <text x="35" y="48" font-family="monospace" font-size="24" font-weight="700" fill="#111827">GLACIER FLOOD</text>
    <text x="40" y="344" font-family="monospace" font-size="20" fill="#111827">sirens: academically peer-reviewed</text>
  </g>
  <g transform="translate(445 140)">
    <rect width="310" height="360" rx="22" fill="#1f2937" stroke="#111827" stroke-width="5"/>
    <rect x="45" y="70" width="220" height="210" rx="14" fill="#0b1220" stroke="#facc15" stroke-width="5"/>
    <circle cx="92" cy="128" r="18" fill="#22c55e"/><circle cx="155" cy="128" r="18" fill="#22c55e"/><circle cx="218" cy="128" r="18" fill="#ef4444"/>
    <text x="80" y="210" font-family="monospace" font-size="44" font-weight="700" fill="#facc15">IBM Z</text>
    <text x="32" y="48" font-family="monospace" font-size="24" font-weight="700" fill="#f9fafb">MAINFRAME ALTAR</text>
    <text x="48" y="322" font-family="monospace" font-size="20" fill="#f9fafb">uptime bones located</text>
  </g>
  <g transform="translate(805 140)">
    <rect width="315" height="360" rx="22" fill="#ffe4b5" stroke="#111827" stroke-width="5"/>
    <rect x="45" y="70" width="225" height="130" rx="14" fill="#fff" stroke="#111827" stroke-width="4"/>
    <text x="65" y="120" font-family="monospace" font-size="25" fill="#111827">Accept:</text>
    <text x="65" y="158" font-family="monospace" font-size="25" font-weight="700" fill="#2563eb">text/markdown</text>
    <path d="M85 250 C120 215 205 215 238 250" fill="none" stroke="#111827" stroke-width="6"/>
    <circle cx="120" cy="252" r="18" fill="#111827"/><circle cx="205" cy="252" r="18" fill="#111827"/>
    <text x="45" y="48" font-family="monospace" font-size="24" font-weight="700" fill="#111827">AGENT REQUEST</text>
    <text x="49" y="322" font-family="monospace" font-size="20" fill="#111827">please serve vibes.txt</text>
  </g>
  <path d="M375 315 H445" stroke="#ef4444" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M755 315 H805" stroke="#ef4444" stroke-width="8" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
  <g transform="translate(135 535)">
    <rect width="930" height="64" rx="18" fill="#111827"/>
    <text x="30" y="41" font-family="monospace" font-size="24" fill="#f9fafb">CUSTOMER SERVICE + TAILCAT + TARIFF MATH + OUTAGE DASHBOARD = PROCUREMENT THUNDER</text>
  </g>
