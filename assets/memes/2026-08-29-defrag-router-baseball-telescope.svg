      <rect y="84" width="70" height="28" fill="#06d6a0"/><rect x="78" y="84" width="140" height="28" fill="#64b5f6"/><rect x="226" y="84" width="66" height="28" fill="#ffd166"/><rect x="300" y="84" width="144" height="28" fill="#ef476f"/>
    </g>
    <text x="30" y="195" font-family="monospace" font-size="20" fill="#f6efe2">STATUS: nostalgia optimizing panic</text>
  </g>
  <g transform="translate(650 138)">
