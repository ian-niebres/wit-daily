    <text x="28" y="205" font-family="monospace" font-size="20" fill="#24243a">packet goblin seeks meaning</text>
  </g>
  <g transform="translate(96 420)">
    <rect width="420" height="190" rx="24" fill="#ecfeff" stroke="#24243a" stroke-width="5"/>
    <circle cx="95" cy="95" r="46" fill="#f97316"/><path d="M95 50 L112 92 L158 92 L121 118 L135 158 L95 133 L55 158 L69 118 L32 92 L78 92 Z" fill="#fff3c4"/>
