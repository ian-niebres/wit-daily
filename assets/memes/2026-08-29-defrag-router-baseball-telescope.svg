<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Defrag monk routes baseball telescope</title>
  <desc id="desc">A satirical dashboard connecting Windows 98 defrag blocks, a router goblin, AI chips, and a baseball stealing second base under a telescope.</desc>
  <rect width="1200" height="720" fill="#12131f"/>
  <rect x="42" y="44" width="1116" height="632" rx="34" fill="#f6efe2" stroke="#24243a" stroke-width="8"/>
