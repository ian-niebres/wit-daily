    <path d="M155 135 C245 190, 295 168, 380 194" stroke="#24243a" stroke-width="6" fill="none" stroke-dasharray="10 10"/>
    <text x="185" y="107" font-family="monospace" font-size="22" fill="#24243a">agent complains</text>
