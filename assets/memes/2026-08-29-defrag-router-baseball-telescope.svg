  <g transform="translate(78 145)">
    <rect width="500" height="220" rx="18" fill="#1d2235"/>
    <text x="28" y="48" font-family="monospace" font-size="25" fill="#c8ffe1">DEFRAG98.EXE</text>
    <g transform="translate(28 75)">
      <rect width="56" height="28" fill="#ff6b6b"/><rect x="64" width="90" height="28" fill="#ffd166"/><rect x="162" width="38" height="28" fill="#06d6a0"/><rect x="208" width="120" height="28" fill="#64b5f6"/><rect x="336" width="55" height="28" fill="#ffd166"/><rect x="399" width="45" height="28" fill="#ef476f"/>
