<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Model-card casino salary-cap bunker</title>
  <desc id="desc">A satirical dashboard where model cards, code review, NPC life, and salary-cap compliance all feed one broken machine.</desc>
  <rect width="960" height="540" fill="#110f1f"/>
  <rect x="34" y="34" width="892" height="472" rx="28" fill="#f7ead7" stroke="#2b2348" stroke-width="8"/>
  <text x="70" y="82" font-family="monospace" font-size="28" font-weight="700" fill="#2b2348">TODAY'S INTERNET CONTROL ROOM</text>
  <g transform="translate(70 115)">
    <rect width="245" height="145" rx="16" fill="#fff7ed" stroke="#2b2348" stroke-width="4"/>
    <text x="22" y="36" font-family="monospace" font-size="20" font-weight="700" fill="#2b2348">MODEL CARD</text>
    <text x="24" y="73" font-family="monospace" font-size="17" fill="#2b2348">Confidence: 104%</text>
    <text x="24" y="103" font-family="monospace" font-size="17" fill="#2b2348">Safety: vibes</text>
    <text x="24" y="132" font-family="monospace" font-size="17" fill="#2b2348">Weather: cyber</text>
  </g>
  <g transform="translate(360 115)">
    <rect width="245" height="145" rx="16" fill="#fff7ed" stroke="#2b2348" stroke-width="4"/>
    <text x="22" y="36" font-family="monospace" font-size="20" font-weight="700" fill="#2b2348">CODE REVIEW</text>
    <path d="M30 74 h185 M30 101 h120 M30 128 h160" stroke="#2b2348" stroke-width="8" stroke-linecap="round"/>
    <circle cx="205" cy="105" r="25" fill="#ff6b6b"/>
    <text x="191" y="113" font-family="monospace" font-size="22" font-weight="700" fill="#fff">?</text>
  </g>
  <g transform="translate(650 115)">
    <rect width="210" height="145" rx="16" fill="#fff7ed" stroke="#2b2348" stroke-width="4"/>
    <text x="22" y="36" font-family="monospace" font-size="20" font-weight="700" fill="#2b2348">NPC LIFE</text>
    <circle cx="105" cy="78" r="24" fill="#2b2348"/>
    <path d="M105 102 v42 M72 120 h66" stroke="#2b2348" stroke-width="10" stroke-linecap="round"/>
    <text x="48" y="132" font-family="monospace" font-size="15" fill="#fff7ed">skip quest</text>
  </g>
  <path d="M190 280 C240 320 310 330 360 355" stroke="#2b2348" stroke-width="6" fill="none" marker-end="url(#a)"/>
  <path d="M485 280 C480 320 470 330 458 356" stroke="#2b2348" stroke-width="6" fill="none" marker-end="url(#a)"/>
  <path d="M750 280 C690 330 585 340 520 360" stroke="#2b2348" stroke-width="6" fill="none" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2b2348"/></marker></defs>
  <g transform="translate(275 350)">
    <rect width="410" height="105" rx="18" fill="#2b2348"/>
    <text x="30" y="42" font-family="monospace" font-size="23" font-weight="700" fill="#f7ead7">SALARY-CAP BUNKER</text>
    <text x="30" y="78" font-family="monospace" font-size="18" fill="#f7ead7">five draft picks enter, one spreadsheet leaves</text>
  </g>
</svg>