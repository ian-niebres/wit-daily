<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Clipboard rocket over map and jukebox</title>
  <desc id="desc">A satirical SVG showing a rocket-shaped clipboard, a renamed map, a doomscroll jukebox, and a thousand-year disc.</desc>
  <rect width="960" height="540" fill="#101827"/>
  <rect x="38" y="34" width="884" height="472" rx="28" fill="#f6efe2" stroke="#f5b84b" stroke-width="6"/>
  <text x="480" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#172033">TODAY'S INTERNET OPERATING SYSTEM</text>
  <g transform="translate(95 125)">
    <rect x="0" y="0" width="250" height="310" rx="20" fill="#dbeafe" stroke="#172033" stroke-width="5"/>
    <rect x="82" y="-18" width="86" height="42" rx="10" fill="#f59e0b" stroke="#172033" stroke-width="5"/>
    <path d="M125 62 L178 186 L125 160 L72 186 Z" fill="#ef4444" stroke="#172033" stroke-width="5"/>
    <text x="125" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">SECURE</text>
    <text x="125" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">CLIPBOARD</text>
    <text x="125" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">now with launch smoke</text>
  </g>
  <g transform="translate(375 136)">
    <rect x="0" y="0" width="230" height="186" rx="18" fill="#dcfce7" stroke="#172033" stroke-width="5"/>
    <path d="M25 42 C85 5 130 92 204 43" fill="none" stroke="#22c55e" stroke-width="10"/>
    <path d="M33 126 C92 88 132 158 200 115" fill="none" stroke="#3b82f6" stroke-width="10"/>
    <text x="115" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">NEW MEXICO</text>
    <text x="115" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#dc2626">NEW AMERICA?</text>
    <path d="M118 144 l28 34 h-56 z" fill="#f97316" stroke="#172033" stroke-width="4"/>
  </g>
  <g transform="translate(650 126)">
    <rect x="0" y="0" width="205" height="290" rx="22" fill="#1f2937" stroke="#172033" stroke-width="5"/>
    <rect x="28" y="32" width="149" height="64" rx="8" fill="#fef3c7"/>
    <text x="102" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">DOOMSCROLL</text>
    <circle cx="62" cy="162" r="34" fill="#f472b6" stroke="#f6efe2" stroke-width="5"/>
    <circle cx="142" cy="162" r="34" fill="#60a5fa" stroke="#f6efe2" stroke-width="5"/>
    <rect x="44" y="224" width="118" height="24" rx="12" fill="#34d399"/>
    <text x="102" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f6efe2">free macOS jukebox</text>
  </g>
  <g transform="translate(392 352)">
    <circle cx="70" cy="60" r="54" fill="#e5e7eb" stroke="#172033" stroke-width="5"/>
    <circle cx="70" cy="60" r="18" fill="#f6efe2" stroke="#172033" stroke-width="4"/>
    <text x="170" y="50" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172033">M-DISC</text>
    <text x="170" y="82" font-family="Arial, sans-serif" font-size="20" fill="#172033">stores the bug report until 3026</text>
  </g>
  <text x="480" y="492" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#172033">Consensus: copy, launch, rename, preserve, repeat.</text>
</svg>
