<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Spy TV Linux Agent Tollbooth</title><desc id="desc">A satirical diagram of a smart TV, Linux trust attack, agent video pipeline, and football buyout fog.</desc><rect width="1100" height="620" fill="#fff9ee"/><rect x="36" y="36" width="1028" height="548" rx="28" fill="#ffffff" stroke="#171717" stroke-width="8"/><text x="70" y="95" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#171717">TODAY'S INTERNET OPERATING ROOM</text><g transform="translate(70 135)"><rect x="0" y="0" width="330" height="210" rx="18" fill="#15b8c8" stroke="#171717" stroke-width="6"/><rect x="34" y="34" width="262" height="126" rx="10" fill="#171717"/><circle cx="165" cy="98" r="36" fill="#ff5a7a"/><circle cx="165" cy="98" r="12" fill="#fff9ee"/><text x="42" y="195" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#171717">216M SPY TVs</text></g><g transform="translate(445 125)"><path d="M72 18 h260 l42 58 v260 h-302 z" fill="#f2c94c" stroke="#171717" stroke-width="6"/><path d="M332 18 v58 h42" fill="none" stroke="#171717" stroke-width="6"/><text x="105" y="108" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">LINUX DISTRO</text><text x="117" y="150" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900">TRUST ATTACK</text><path d="M125 205 h195" stroke="#171717" stroke-width="8"/><path d="M125 245 h145" stroke="#171717" stroke-width="8"/><text x="98" y="310" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">signed by: vibes</text></g><g transform="translate(820 145)"><rect x="0" y="0" width="190" height="155" rx="16" fill="#35b779" stroke="#171717" stroke-width="6"/><polygon points="70,45 70,112 130,78" fill="#fff9ee" stroke="#171717" stroke-width="5"/><text x="18" y="205" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">HTML → VIDEO</text><text x="34" y="236" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">FOR AGENTS</text></g><path d="M405 238 C430 235 430 235 445 235" stroke="#171717" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M772 238 C798 235 800 235 820 224" stroke="#171717" stroke-width="6" fill="none" marker-end="url(#arrow)"/><g transform="translate(170 410)"><rect x="0" y="0" width="760" height="92" rx="20" fill="#ff5a7a" stroke="#171717" stroke-width="6"/><text x="32" y="38" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="900" fill="#171717">SPORTS MACRO FOG:</text><text x="32" y="72" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#171717">buyouts, brackets, cryptic injuries, Judge incense</text></g><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#171717"/></marker></defs></svg>