<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Math aquarium with DNA atlas and tennis bracket tribunal</title>
  <desc id="desc">A fake control room where Navier-Stokes foam, genome maps, border signs, agent skills, and tennis brackets share one dashboard.</desc>
  <rect width="1200" height="675" fill="#101827"/>
  <rect x="50" y="45" width="1100" height="585" rx="28" fill="#17243a" stroke="#75f0d1" stroke-width="4"/>
  <text x="600" y="92" fill="#f8fafc" font-family="monospace" font-size="34" text-anchor="middle">INTERNET MOOD OPERATIONS</text>
  <g transform="translate(90 130)">
    <rect width="320" height="390" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="160" y="45" fill="#bae6fd" font-family="monospace" font-size="24" text-anchor="middle">MATH AQUARIUM</text>
    <path d="M35 255 C90 205,145 305,210 250 S295 245,300 285 L300 350 L35 350 Z" fill="#164e63" opacity=".8"/>
    <circle cx="92" cy="220" r="26" fill="#67e8f9"/>
    <circle cx="202" cy="192" r="20" fill="#a7f3d0"/>
    <circle cx="255" cy="250" r="16" fill="#fef08a"/>
    <text x="160" y="125" fill="#f8fafc" font-family="monospace" font-size="22" text-anchor="middle">Navier-Stokes</text>
    <text x="160" y="154" fill="#f8fafc" font-family="monospace" font-size="22" text-anchor="middle">foams ominously</text>
    <text x="160" y="325" fill="#cffafe" font-family="monospace" font-size="20" text-anchor="middle">Prize problem: hydrated</text>
  </g>
  <g transform="translate(440 130)">
    <rect width="320" height="390" rx="22" fill="#0f172a" stroke="#a78bfa" stroke-width="3"/>
    <text x="160" y="45" fill="#ddd6fe" font-family="monospace" font-size="24" text-anchor="middle">DNA ATLAS</text>
    <path d="M105 90 C230 145,90 215,215 270" fill="none" stroke="#f0abfc" stroke-width="8"/>
    <path d="M215 90 C90 145,230 215,105 270" fill="none" stroke="#86efac" stroke-width="8"/>
    <g stroke="#e0e7ff" stroke-width="4">
      <line x1="130" y1="115" x2="190" y2="115"/><line x1="112" y1="155" x2="210" y2="155"/><line x1="115" y1="198" x2="205" y2="198"/><line x1="130" y1="240" x2="190" y2="240"/>
    </g>
    <rect x="65" y="300" width="190" height="45" rx="8" fill="#312e81"/>
    <text x="160" y="329" fill="#f5f3ff" font-family="monospace" font-size="20" text-anchor="middle">CELL ROADMAP</text>
  </g>
  <g transform="translate(790 130)">
    <rect width="320" height="390" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <text x="160" y="45" fill="#fde68a" font-family="monospace" font-size="24" text-anchor="middle">TRIBUNAL</text>
    <rect x="45" y="82" width="230" height="72" rx="10" fill="#7c2d12"/>
    <text x="160" y="112" fill="#fff7ed" font-family="monospace" font-size="19" text-anchor="middle">NOT 51ST STATE</text>
    <text x="160" y="140" fill="#fff7ed" font-family="monospace" font-size="19" text-anchor="middle">SORRY!</text>
    <path d="M70 205 H250 M90 205 V305 M140 205 V305 M190 205 V305 M240 205 V305" stroke="#fef3c7" stroke-width="5"/>
    <circle cx="70" cy="205" r="13" fill="#fef08a"/><circle cx="250" cy="305" r="13" fill="#fef08a"/>
    <text x="160" y="360" fill="#fffbeb" font-family="monospace" font-size="20" text-anchor="middle">US OPEN BRACKET</text>
  </g>
  <g transform="translate(260 555)">
    <rect width="680" height="48" rx="24" fill="#020617" stroke="#94a3b8"/>
    <text x="340" y="31" fill="#e2e8f0" font-family="monospace" font-size="21" text-anchor="middle">AGENT SKILL INSTALLED: stop burying the prophecy</text>
  </g>
</svg>
