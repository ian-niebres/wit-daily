<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Native spy cable chapel</title>
  <desc id="desc">A satirical control room wiring native apps, spy globes, cables, proof stamps, and sports trends into one mood machine.</desc>
  <rect width="1200" height="720" fill="#10131f"/>
