  <path d="M370 360 C430 340 450 340 500 330" fill="none" stroke="#111827" stroke-width="8" stroke-dasharray="14 13"/>
  <path d="M760 330 C805 340 820 345 830 350" fill="none" stroke="#111827" stroke-width="8" stroke-dasharray="14 13"/>
