"monospace" font-size="22" fill="#222">a discourse</text></g><g transform="translate(145 468)"><rect width="268" height="142" rx="18" fill="#ffadad" stroke="#222" stroke-width="5"/><text x="28" y="48" font-family="monospace" font-size="24" font-weight="700" fill="#222">BOT INSTALLS</text><text x="28" y="88" font-family="monospace" font-size="22" fill="#222">60% raccoon</text></g><g transform="translate(484 448)"><circle cx="118" cy="88" r="82" fill="#bdb2ff" stroke="#222" stroke-width="5"/><path d="M54 88h128M118 24v128M72 42c44 36 48 58 92 92M164 42c-44 36-48 58-92 92" stroke="#222" stroke-width="4" fill="none"/><text x="42" y="202" font-family="monospace" font-size="22" font-weight="700" fill="#222">SPY GLOBE</text></g><g transform="translate(805 468)"><rect width="292" height="142" rx="18" fill="#fdffb6" stroke="#222" stroke-width="5"/><text x="24" y="48" font-family="monospace" font-size="24" font-weight="700" fill="#222">TENNIS SEARCH</text><text x="24" y="88" font-family="monospace" font-size="22" fill="#222">romance + bracket</text><text x="24" y="118" font-family="monospace" font-size="22" fill="#222">= national fog</text></g><g stroke="#222" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="12 10"><path d="M368 288 C410 250 424 238 466 248"/><path d="M742 274 C780 250 804 248 826 262"/><path d="M276 378 C312 438 346 464 412 512"/><path d="M602 380 V448"/><path d="M742 530 C774 514 786 508 805 510"/></g><text x="91" y="670" font-family="monospace" font-size="24" fill="#222">recommended action: file a ticket with the vibes desk; do not deploy the raccoon</text></svg>