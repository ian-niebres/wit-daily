<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">GPU central bank cafeteria denial board</title>
  <desc id="desc">A satirical dashboard connecting a GPU central bank, spy TV denial, Costco cafeteria furniture, and football heat.</desc>
  <rect width="960" height="540" fill="#111827"/>
  <rect x="36" y="34" width="888" height="472" rx="28" fill="#f8fafc" stroke="#0f172a" stroke-width="6"/>
  <text x="72" y="86" font-family="monospace" font-size="32" font-weight="700" fill="#111827">WEEKEND LIQUIDITY COMMITTEE</text>
  <text x="72" y="122" font-family="monospace" font-size="18" fill="#475569">status: markets closed, vibes fully tradable</text>
  <rect x="70" y="160" width="250" height="210" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="95" y="205" font-family="monospace" font-size="23" font-weight="700" fill="#1e3a8a">GPU CENTRAL BANK</text>
  <circle cx="195" cy="278" r="54" fill="#facc15" stroke="#92400e" stroke-width="5"/>
  <text x="159" y="286" font-family="monospace" font-size="28" font-weight="700" fill="#78350f">NVDA</text>
  <text x="100" y="344" font-family="monospace" font-size="17" fill="#1e3a8a">sets interest rates in CUDA</text>
  <rect x="355" y="160" width="250" height="210" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/>
  <text x="386" y="205" font-family="monospace" font-size="23" font-weight="700" fill="#7f1d1d">SPY TV CHAPEL</text>
  <rect x="425" y="235" width="110" height="70" rx="8" fill="#111827"/>
  <circle cx="480" cy="270" r="15" fill="#22c55e"/>
  <text x="395" y="344" font-family="monospace" font-size="17" fill="#7f1d1d">denies all prayers in 4K</text>
  <rect x="640" y="160" width="250" height="210" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="670" y="205" font-family="monospace" font-size="23" font-weight="700" fill="#14532d">COSTCO CAFE</text>
  <rect x="690" y="248" width="150" height="38" rx="8" fill="#94a3b8"/>
  <circle cx="725" cy="305" r="18" fill="#f97316"/>
  <circle cx="805" cy="305" r="18" fill="#f97316"/>
  <text x="670" y="344" font-family="monospace" font-size="17" fill="#14532d">display sofa yield +12%</text>
  <path d="M320 270 H355" stroke="#0f172a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M605 270 H640" stroke="#0f172a" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M195 370 C250 445 700 445 765 370" fill="none" stroke="#7c3aed" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="210" y="440" font-family="monospace" font-size="24" font-weight="700" fill="#4c1d95">football heat index converted to pending orders</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#0f172a"/></marker></defs>
</svg>