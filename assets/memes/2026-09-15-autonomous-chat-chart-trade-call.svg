<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous company chat chart trade call</title>
  <desc id="desc">A satirical control room where a robot CEO, chat chart, Steam price tag, and Toronto trade call fight for the same dashboard.</desc>
  <rect width="1200" height="760" fill="#130f24"/>
  <rect x="40" y="40" width="1120" height="680" rx="34" fill="#f7efe2" stroke="#090616" stroke-width="10"/>
  <text x="75" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" font-weight="800" fill="#130f24">TODAY'S OPERATING SYSTEM: BUREAUCRATIC KARAOKE</text>
  <g transform="translate(80 145)">
    <rect width="315" height="465" rx="22" fill="#d9ecff" stroke="#130f24" stroke-width="7"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#130f24">ROBOT CEO</text>
    <circle cx="157" cy="165" r="72" fill="#fff" stroke="#130f24" stroke-width="7"/>
    <rect x="105" y="125" width="104" height="74" rx="12" fill="#130f24"/>
    <circle cx="132" cy="162" r="10" fill="#84ffcb"/><circle cx="182" cy="162" r="10" fill="#84ffcb"/>
    <path d="M120 255 L195 255 L225 365 L90 365 Z" fill="#ffcf5a" stroke="#130f24" stroke-width="7"/>
    <text x="54" y="420" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#130f24">RUN ANY COMPANY</text>
    <text x="76" y="454" font-family="Arial, sans-serif" font-size="24" fill="#130f24">(except payroll)</text>
  </g>
  <g transform="translate(442 145)">
    <rect width="315" height="465" rx="22" fill="#fbe2ff" stroke="#130f24" stroke-width="7"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#130f24">CHAT CHART</text>
    <rect x="38" y="92" width="240" height="210" rx="18" fill="#fff" stroke="#130f24" stroke-width="6"/>
    <path d="M70 255 C115 150 145 238 185 150 S240 170 250 118" fill="none" stroke="#ff477e" stroke-width="10"/>
    <text x="64" y="350" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#130f24">"explain Q3"</text>
    <text x="78" y="392" font-family="Arial, sans-serif" font-size="24" fill="#130f24">*becomes weather*</text>
  </g>
  <g transform="translate(804 145)">
    <rect width="315" height="465" rx="22" fill="#e4ffd5" stroke="#130f24" stroke-width="7"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#130f24">TRADE CALL</text>
    <path d="M70 125 h175 a35 35 0 0 1 35 35 v115 a35 35 0 0 1-35 35H155l-56 60v-60H70a35 35 0 0 1-35-35V160a35 35 0 0 1 35-35z" fill="#fff" stroke="#130f24" stroke-width="7"/>
    <text x="70" y="190" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#130f24">TORONTO:</text>
    <text x="70" y="230" font-family="Arial, sans-serif" font-size="26" fill="#130f24">is Kawhi</text>
    <text x="70" y="264" font-family="Arial, sans-serif" font-size="26" fill="#130f24">priced in?</text>
    <text x="54" y="415" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#130f24">STEAM FRAME</text>
    <rect x="87" y="438" width="142" height="58" rx="14" fill="#130f24"/>
    <text x="112" y="478" font-family="Arial, sans-serif" font-size="28" font-weight="800" fill="#ffcf5a">$1059</text>
  </g>
  <path d="M395 378 H442" stroke="#130f24" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M757 378 H804" stroke="#130f24" stroke-width="8" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#130f24"/></marker></defs>
  <text x="74" y="675" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="31" font-weight="800" fill="#130f24">CONSENSUS: UPDATE THE DEVICE, SUE THE BOT, ASK THE CHART TO SING.</text>
</svg>
