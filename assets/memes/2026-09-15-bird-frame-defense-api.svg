<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Bird frame incident response dashboard</title><desc id="desc">A satirical e-ink bird frame perched on an incident response dashboard while a tour cancellation domino falls.</desc><rect width="1200" height="720" fill="#fff9ee"/><rect x="36" y="36" width="1128" height="648" rx="28" fill="#fffef8" stroke="#171717" stroke-width="8"/><text x="74" y="108" font-family="Georgia,serif" font-size="54" font-weight="700" fill="#171717">FRONT PAGE WEATHER STATION</text><rect x="72" y="150" width="340" height="420" rx="18" fill="#171717"/><rect x="102" y="184" width="280" height="220" rx="10" fill="#e9f2ea" stroke="#f2c94c" stroke-width="6"/><circle cx="230" cy="285" r="56" fill="#15b8c8" stroke="#171717" stroke-width="6"/><path d="M205 280c40-58 95-36 98 15-33 6-64 4-98-15z" fill="#ff5a7a" stroke="#171717" stroke-width="5"/><path d="M180 330c75 28 130 7 172-43" fill="none" stroke="#171717" stroke-width="8" stroke-linecap="round"/><text x="128" y="455" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff9ee">E-INK BIRD:</text><text x="128" y="498" font-family="Arial,sans-serif" font-size="28" fill="#f2c94c">“chirp chirp, SOC 2”</text><rect x="468" y="154" width="290" height="154" rx="16" fill="#15b8c8" stroke="#171717" stroke-width="6"/><text x="492" y="206" font-family="Arial,sans-serif" font-size="30" font-weight="800">DEFENSE API</text><text x="492" y="252" font-family="Arial,sans-serif" font-size="25">connected weapon</text><text x="492" y="282" font-family="Arial,sans-serif" font-size="25">suite, but make it docs</text><rect x="468" y="346" width="290" height="178" rx="16" fill="#ffffff" stroke="#171717" stroke-width="6"/><polyline points="500,480 548,430 594,455 648,385 720,405" fill="none" stroke="#ff5a7a" stroke-width="10" stroke-linecap="round"/><text x="500" y="394" font-family="Arial,sans-serif" font-size="28" font-weight="800">AGENT MARKET</text><text x="500" y="510" font-family="Arial,sans-serif" font-size="22">research / CRM / code review</text><rect x="812" y="150" width="260" height="410" rx="16" fill="#f2c94c" stroke="#171717" stroke-width="6"/><text x="844" y="206" font-family="Arial,sans-serif" font-size="32" font-weight="900">TOUR</text><text x="844" y="244" font-family="Arial,sans-serif" font-size="32" font-weight="900">DOMINOES</text><g fill="#fff9ee" stroke="#171717" stroke-width="5"><rect x="852" y="292" width="50" height="145" rx="8" transform="rotate(-18 877 364)"/><rect x="925" y="292" width="50" height="145" rx="8" transform="rotate(-8 950 364)"/><rect x="998" y="292" width="50" height="145" rx="8" transform="rotate(18 1023 364)"/></g><text x="836" y="500" font-family="Arial,sans-serif" font-size="23">opening act.exe</text><text x="836" y="530" font-family="Arial,sans-serif" font-size="23">has left the chat</text><path d="M414 350 C455 306 455 276 468 240" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="12 12"/><path d="M760 435 C805 404 808 386 834 370" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="12 12"/><text x="78" y="632" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#171717">Diagnosis: every cute gadget is now one procurement meeting from becoming a dashboard.</text></svg>