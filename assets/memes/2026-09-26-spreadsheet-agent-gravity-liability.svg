<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Spreadsheet liability weather map</title><desc id="desc">A fake dashboard where agents, spreadsheets, gravity, and compliance all collide.</desc><rect width="920" height="520" fill="#111827"/><rect x="35" y="35" width="850" height="450" rx="28" fill="#f8fafc" stroke="#38bdf8" stroke-width="6"/><text x="70" y="88" font-family="monospace" font-size="30" font-weight="700" fill="#111827">WEEKEND LIABILITY WEATHER</text><text x="70" y="124" font-family="monospace" font-size="17" fill="#475569">front-page instruments: agents / Excel / holographic gravity / museum snail</text><g transform="translate(70 165)"><rect width="230" height="230" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="25" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#1e3a8a">AGENT CLOUD</text><circle cx="67" cy="105" r="31" fill="#60a5fa"/><circle cx="126" cy="93" r="42" fill="#93c5fd"/><circle cx="170" cy="118" r="30" fill="#60a5fa"/><text x="28" y="180" font-family="monospace" font-size="18" fill="#1e3a8a">approval loop?</text><text x="28" y="205" font-family="monospace" font-size="18" fill="#1e3a8a">ask legal</text></g><g transform="translate(345 165)"><rect width="230" height="230" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="28" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#14532d">EXCEL CELL</text><rect x="38" y="78" width="154" height="100" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/><line x1="89" y1="78" x2="89" y2="178" stroke="#15803d"/><line x1="141" y1="78" x2="141" y2="178" stroke="#15803d"/><line x1="38" y1="112" x2="192" y2="112" stroke="#15803d"/><line x1="38" y1="145" x2="192" y2="145" stroke="#15803d"/><text x="54" y="134" font-family="monospace" font-size="16" fill="#166534">5 facts</text><text x="54" y="205" font-family="monospace" font-size="18" fill="#14532d">one tiny apartment</text></g><g transform="translate(620 165)"><rect width="230" height="230" rx="18" fill="#fae8ff" stroke="#a21caf" stroke-width="4"/><text x="25" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#701a75">REALITY</text><path d="M45 170 C80 60,150 60,185 170" fill="none" stroke="#c026d3" stroke-width="8"/><circle cx="115" cy="118" r="45" fill="none" stroke="#86198f" stroke-width="5" stroke-dasharray="8 8"/><text x="43" y="205" font-family="monospace" font-size="18" fill="#701a75">hologram pending</text></g><path d="M300 280 H345" stroke="#111827" stroke-width="5" marker-end="url(#a)"/><path d="M575 280 H620" stroke="#111827" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs><g transform="translate(83 425)"><rect width="755" height="42" rx="12" fill="#111827"/><text x="22" y="28" font-family="monospace" font-size="18" fill="#f8fafc">fund action: queue tiny orders; wait for Monday; blame the snail if necessary</text></g></svg>