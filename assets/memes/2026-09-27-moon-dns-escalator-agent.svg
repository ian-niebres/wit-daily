<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Moon DNS Escalator Agent</title><desc id="desc">A satirical control room where the harvest moon routes DNS agents onto a slow escalator and a land-value chart.</desc><rect width="1200" height="720" fill="#fff9ee"/><rect x="35" y="35" width="1130" height="650" rx="26" fill="#fffef8" stroke="#171717" stroke-width="8"/><circle cx="185" cy="155" r="82" fill="#f2c94c" stroke="#171717" stroke-width="6"/><circle cx="152" cy="128" r="10" fill="#171717"/><circle cx="205" cy="147" r="8" fill="#171717"/><path d="M150 184 Q185 212 230 178" fill="none" stroke="#171717" stroke-width="7" stroke-linecap="round"/><text x="86" y="292" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#171717">HARVEST MOON</text><text x="102" y="338" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#68635d">searched by everyone, explained by nobody</text><g transform="translate(430 110)"><rect width="310" height="160" rx="18" fill="#15b8c8" stroke="#171717" stroke-width="6"/><text x="30" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#171717">DNS AGENT</text><text x="30" y="98" font-family="Arial,sans-serif" font-size="23" font-weight="800" fill="#171717">escaped via TXT record</text><path d="M52 126 H256" stroke="#171717" stroke-width="8" stroke-linecap="round"/><circle cx="78" cy="126" r="16" fill="#ff5a7a" stroke="#171717" stroke-width="5"/><circle cx="230" cy="126" r="16" fill="#f2c94c" stroke="#171717" stroke-width="5"/></g><g transform="translate(785 90)"><rect width="300" height="230" rx="18" fill="#fff" stroke="#171717" stroke-width="6"/><text x="30" y="46" font-family="Arial,sans-serif" font-size="25" font-weight="900" fill="#171717">LAND VALUE</text><polyline points="36,174 92,132 146,145 202,80 260,62" fill="none" stroke="#35b779" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 62 l-20 -4 l14 -16" fill="none" stroke="#35b779" stroke-width="8" stroke-linecap="round"/><text x="36" y="210" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#68635d">Georgism? in this economy?</text></g><g transform="translate(310 390) rotate(-6)"><rect width="620" height="86" rx="12" fill="#171717"/><rect x="24" y="18" width="572" height="16" fill="#fff"/><rect x="24" y="52" width="572" height="16" fill="#fff"/><text x="92" y="-18" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#171717">LA METRO ESCALATOR SPEEDRUN</text></g><g transform="translate(285 520)"><rect width="650" height="86" rx="18" fill="#ff5a7a" stroke="#171717" stroke-width="6"/><text x="34" y="55" font-family="Arial,sans-serif" font-size="31" font-weight="900" fill="#171717">COMPLIANCE: please walk slower</text></g><path d="M265 190 C365 210 375 220 430 190" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="12 12"/><path d="M740 190 C780 185 790 180 785 180" fill="none" stroke="#171717" stroke-width="5" stroke-dasharray="12 12"/><text x="72" y="640" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#171717">TODAY'S INTERNET: moon tab + agent tab + sports tab + one chart about land</text></svg>