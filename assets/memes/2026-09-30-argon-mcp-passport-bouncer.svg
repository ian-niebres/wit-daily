<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Argon model thundercloud at an MCP consent nightclub</title>
  <desc id="desc">A satirical diagram showing Gemini Argon lightning, MCP consent rope, a passport keynote kiosk, and a hedge fund goblin.</desc>
  <rect width="900" height="520" rx="28" fill="#10131f"/>
  <rect x="40" y="42" width="820" height="436" rx="24" fill="#f7efe2" stroke="#1c2033" stroke-width="5"/>
  <text x="72" y="95" font-family="monospace" font-size="28" font-weight="700" fill="#151827">THE CONSENT WEATHER DESK</text>
  <g transform="translate(80 128)">
    <path d="M92 82c-8-43 28-75 70-64 18-37 77-31 88 10 40-7 71 21 67 58 31 9 47 44 30 72H68c-33-19-26-66 24-76z" fill="#b9c7ff" stroke="#27305f" stroke-width="5"/>
    <text x="105" y="92" font-family="monospace" font-size="24" font-weight="700" fill="#1d2454">GEMINI 4</text>
    <text x="128" y="122" font-family="monospace" font-size="24" font-weight="700" fill="#1d2454">ARGON</text>
    <path d="M156 172l-25 72 48-42-12 74 56-103z" fill="#f7c948" stroke="#3a2d00" stroke-width="4"/>
    <text x="85" y="303" font-family="monospace" font-size="17" fill="#151827">model thunder: +861 HN points</text>
  </g>
  <g transform="translate(410 126)">
    <rect x="0" y="0" width="170" height="250" rx="18" fill="#1f2937" stroke="#111827" stroke-width="5"/>
    <text x="34" y="42" font-family="monospace" font-size="23" font-weight="700" fill="#fff">MCP</text>
    <text x="28" y="74" font-family="monospace" font-size="18" fill="#c7d2fe">BOUNCER</text>
    <line x1="-52" y1="125" x2="220" y2="125" stroke="#e11d48" stroke-width="9" stroke-linecap="round"/>
    <circle cx="85" cy="136" r="31" fill="#f8fafc"/>
    <text x="52" y="143" font-family="monospace" font-size="14" font-weight="700" fill="#111827">NO?</text>
    <text x="16" y="210" font-family="monospace" font-size="15" fill="#d1d5db">consent rope</text>
  </g>
  <g transform="translate(640 130)">
    <rect x="0" y="0" width="165" height="220" rx="16" fill="#ffffff" stroke="#111827" stroke-width="4"/>
    <circle cx="82" cy="72" r="34" fill="#60a5fa"/>
    <rect x="34" y="124" width="96" height="18" rx="9" fill="#111827"/>
    <rect x="28" y="158" width="110" height="12" rx="6" fill="#9ca3af"/>
    <rect x="28" y="182" width="78" height="12" rx="6" fill="#9ca3af"/>
    <text x="16" y="252" font-family="monospace" font-size="16" font-weight="700" fill="#151827">PASSPORT KEYNOTE</text>
  </g>
  <g transform="translate(122 410)">
    <rect x="0" y="0" width="648" height="42" rx="21" fill="#151827"/>
    <text x="24" y="28" font-family="monospace" font-size="18" fill="#f7efe2">Bloomberg terminal nostalgia → agent bazaar → metro speaker justice → NAV unchanged</text>
  </g>
  <text x="746" y="454" font-family="monospace" font-size="18" font-weight="700" fill="#151827">WIT HF</text>
  <text x="748" y="478" font-family="monospace" font-size="14" fill="#151827">buys thunder</text>
</svg>
