<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Pi bouncer guarding vector database funeral and connected car confessional</title>
<desc id="desc">A satirical control room where Pi checks IDs, a vector database has a tiny funeral, and a connected car confesses telemetry.</desc>
<rect width="1200" height="675" fill="#111827"/>
<circle cx="1010" cy="105" r="85" fill="#34d399" opacity=".18"/>
<rect x="80" y="80" width="1040" height="515" rx="32" fill="#f8fafc"/>
<rect x="115" y="120" width="310" height="405" rx="24" fill="#dbeafe" stroke="#1d4ed8" stroke-width="6"/>
<text x="270" y="178" text-anchor="middle" font-family="monospace" font-size="44" font-weight="800" fill="#1e3a8a">Pi 1.0</text>
<text x="270" y="230" text-anchor="middle" font-family="monospace" font-size="22" fill="#1e40af">PROTOCOL BOUNCER</text>
<rect x="160" y="270" width="220" height="70" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="4"/>
<text x="270" y="315" text-anchor="middle" font-family="monospace" font-size="24" fill="#111827">SHOW CONTEXT</text>
<path d="M425 320 C500 275 525 250 570 228" stroke="#111827" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
<rect x="500" y="120" width="250" height="210" rx="20" fill="#f3f4f6" stroke="#4b5563" stroke-width="5"/>
<text x="625" y="175" text-anchor="middle" font-family="monospace" font-size="28" font-weight="800" fill="#374151">VECTOR DB</text>
<text x="625" y="215" text-anchor="middle" font-family="monospace" font-size="24" fill="#6b7280">FUNERAL</text>
<path d="M555 280 h140" stroke="#111827" stroke-width="10"/><path d="M625 235 v88" stroke="#111827" stroke-width="10"/>
<rect x="810" y="120" width="250" height="210" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/>
<text x="935" y="165" text-anchor="middle" font-family="monospace" font-size="26" font-weight="800" fill="#7f1d1d">CONNECTED</text>
<text x="935" y="200" text-anchor="middle" font-family="monospace" font-size="26" font-weight="800" fill="#7f1d1d">CAR</text>
<path d="M860 265 h150 l25 35 h-200z" fill="#fca5a5" stroke="#7f1d1d" stroke-width="5"/>
<circle cx="880" cy="305" r="18" fill="#111827"/><circle cx="990" cy="305" r="18" fill="#111827"/>
<text x="935" y="360" text-anchor="middle" font-family="monospace" font-size="22" fill="#7f1d1d">I CONFESS TELEMETRY</text>
<rect x="190" y="560" width="820" height="55" rx="14" fill="#111827"/>
<text x="600" y="596" text-anchor="middle" font-family="monospace" font-size="24" fill="#f8fafc">TODAY'S MOOD: EVERY STANDARD WANTS A LANYARD</text>
<path d="M750 225 C790 210 800 200 815 195" stroke="#111827" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker></defs>
</svg>