  <path d="M290 190 C330 175 325 205 340 190" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M560 190 C600 175 590 205 620 190" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="450" y="470" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#111827">Consensus: authenticate the doodle, meter the search, bill the panopticon.</text>
