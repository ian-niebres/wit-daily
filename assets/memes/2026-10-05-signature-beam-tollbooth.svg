    <circle cx="58" cy="72" r="18" fill="#92400e"/><circle cx="256" cy="72" r="18" fill="#92400e"/>
    <text x="157" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#78350f">remembers everything except why</text>
