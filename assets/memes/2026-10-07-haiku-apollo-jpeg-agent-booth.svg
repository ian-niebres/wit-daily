<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Haiku Apollo JPEG agent booth</title><desc id="desc">A satirical control room where a model launch cannon, Apollo moon, JPEG tortoise, and agent review booth share one dashboard.</desc><rect width="1200" height="675" fill="#10131f"/><rect x="40" y="40" width="1120" height="595" rx="28" fill="#f7efe2"/><text x="70" y="95" font-family="monospace" font-size="34" fill="#182033" font-weight="700">TODAY'S INTERNET CONTROL ROOM</text><rect x="75" y="130" width="300" height="420" rx="20" fill="#dcecff" stroke="#182033" stroke-width="5"/><text x="105" y="185" font-family="monospace" font-size="30" fill="#182033">MODEL CANNON</text><circle cx="225" cy="310" r="78" fill="#ffcc66" stroke="#182033" stroke-width="5"/><path d="M165 310h120" stroke="#182033" stroke-width="10"/><path d="M225 250v120" stroke="#182033" stroke-width="10"/><text x="137" y="440" font-family="monospace" font-size="28" fill="#182033">HAIKU 5.5</text><text x="123" y="480" font-family="monospace" font-size="22" fill="#182033">GPT-6 CONFETTI</text><rect x="445" y="130" width="305" height="420" rx="20" fill="#fff5cc" stroke="#182033" stroke-width="5"/><circle cx="598" cy="275" r="96" fill="#d8d2c6" stroke="#182033" stroke-width="5"/><circle cx="565" cy="245" r="12" fill="#9b9488"/><circle cx="625" cy="310" r="18" fill="#9b9488"/><path d="M515 410c45-50 118-50 165 0" fill="none" stroke="#182033" stroke-width="7"/><text x="495" y="462" font-family="monospace" font-size="27" fill="#182033">APOLLO MEMORY</text><text x="503" y="500" font-family="monospace" font-size="20" fill="#182033">RESPECT PATCH REQUIRED</text><rect x="825" y="130" width="300" height="420" rx="20" fill="#e7f7df" stroke="#182033" stroke-width="5"/><ellipse cx="975" cy="320" rx="92" ry="58" fill="#74b36b" stroke="#182033" stroke-width="5"/><circle cx="1062" cy="300" r="28" fill="#74b36b" stroke="#182033" stroke-width="5"/><circle cx="1070" cy="292" r="4" fill="#182033"/><path d="M900 321h-45m35 35h-35m200-35h55" stroke="#182033" stroke-width="7" stroke-linecap="round"/><rect x="895" y="215" width="150" height="55" rx="10" fill="#fff" stroke="#182033" stroke-width="4"/><text x="915" y="252" font-family="monospace" font-size="22" fill="#182033">JPEG XL</text><text x="874" y="435" font-family="monospace" font-size="25" fill="#182033">STANDARDS TORTOISE</text><path d="M375 325h70M750 325h75" stroke="#182033" stroke-width="8" stroke-dasharray="16 12"/><rect x="190" y="575" width="820" height="38" rx="19" fill="#182033"/><text x="235" y="602" font-family="monospace" font-size="22" fill="#f7efe2">AGENT REVIEWS AGENT → SUPERVISION TERRARIUM EXPANDS</text></svg>