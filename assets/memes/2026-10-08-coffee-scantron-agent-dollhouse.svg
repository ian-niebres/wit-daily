<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Coffee machine data geyser and agent dollhouse exam room</title>
  <desc id="desc">A coffee machine leaks data into a Scantron slot while tiny agents build a dashboard dollhouse and a GPU shrine.</desc>
  <rect width="960" height="540" fill="#0f172a" />
  <rect x="52" y="50" width="856" height="440" rx="28" fill="#f8fafc" stroke="#38bdf8" stroke-width="6" />
  <text x="86" y="105" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="700" fill="#0f172a">TODAY'S FRONT-PAGE APPLIANCE TEST</text>
  <g transform="translate(90 145)">
    <rect x="0" y="30" width="190" height="230" rx="18" fill="#334155" />
    <rect x="35" y="0" width="120" height="56" rx="14" fill="#64748b" />
    <rect x="35" y="82" width="120" height="76" rx="10" fill="#94a3b8" />
    <circle cx="95" cy="194" r="28" fill="#f97316" />
    <path d="M190 145 C260 95 300 190 370 140" fill="none" stroke="#06b6d4" stroke-width="16" stroke-linecap="round" />
    <text x="22" y="305" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0f172a">COFFEE MACHINE</text>
    <text x="44" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#475569">1TB / 10 DAYS</text>
  </g>
  <g transform="translate(375 135)">
    <rect x="0" y="0" width="210" height="285" rx="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="4" />
    <text x="34" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700" fill="#0f172a">SCANTRON</text>
    <text x="28" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#475569">PLEASE DO NOT JAM</text>
    <g fill="#0f172a">
      <circle cx="45" cy="125" r="9"/><circle cx="86" cy="125" r="9"/><circle cx="127" cy="125" r="9"/><circle cx="168" cy="125" r="9"/>
      <circle cx="45" cy="165" r="9"/><circle cx="86" cy="165" r="9"/><circle cx="127" cy="165" r="9"/><circle cx="168" cy="165" r="9"/>
      <circle cx="45" cy="205" r="9"/><circle cx="86" cy="205" r="9"/><circle cx="127" cy="205" r="9"/><circle cx="168" cy="205" r="9"/>
    </g>
    <rect x="-14" y="244" width="238" height="42" rx="8" fill="#ef4444" />
    <text x="18" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#fff">3 MIN BEFORE EXAM</text>
  </g>
  <g transform="translate(650 145)">
    <rect x="0" y="58" width="190" height="190" rx="14" fill="#fde68a" stroke="#0f172a" stroke-width="4" />
    <polygon points="0,58 95,0 190,58" fill="#fb923c" stroke="#0f172a" stroke-width="4" />
    <rect x="26" y="92" width="48" height="48" fill="#bfdbfe" stroke="#0f172a" stroke-width="3" />
    <rect x="116" y="92" width="48" height="48" fill="#bfdbfe" stroke="#0f172a" stroke-width="3" />
    <rect x="72" y="164" width="48" height="84" fill="#94a3b8" stroke="#0f172a" stroke-width="3" />
    <text x="30" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#0f172a">AGENT DOLLHOUSE</text>
  </g>
  <path d="M595 260 C625 230 630 200 650 190" fill="none" stroke="#8b5cf6" stroke-width="8" stroke-dasharray="14 12" />
  <text x="612" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#6d28d9">DASHBOARD</text>
  <rect x="126" y="452" width="708" height="38" rx="19" fill="#0f172a" />
  <text x="158" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8fafc">Consensus: every appliance wants telemetry, every agent wants a room.</text>
