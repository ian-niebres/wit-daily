<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Decision ambulance in internet traffic</title>
  <desc id="desc">A fake emergency lane where decision models, city builders, AI agents, and license goblins block each other.</desc>
  <rect width="1200" height="675" fill="#10131f"/>
  <rect x="70" y="80" width="1060" height="500" rx="36" fill="#f4efe4" stroke="#24283b" stroke-width="8"/>
  <text x="600" y="55" text-anchor="middle" font-family="monospace" font-size="30" fill="#f4efe4">INTERNET INCIDENT COMMAND: SATURDAY NIGHT</text>
  <g font-family="monospace" font-weight="700">
    <rect x="120" y="165" width="270" height="120" rx="18" fill="#ff6767" stroke="#24283b" stroke-width="5"/>
    <text x="255" y="210" text-anchor="middle" font-size="24" fill="#10131f">DECISION</text>
    <text x="255" y="242" text-anchor="middle" font-size="24" fill="#10131f">MODEL</text>
    <circle cx="165" cy="295" r="28" fill="#24283b"/><circle cx="345" cy="295" r="28" fill="#24283b"/>
    <text x="255" y="330" text-anchor="middle" font-size="18" fill="#10131f">sirens: probabilistic</text>

    <rect x="455" y="150" width="300" height="160" rx="12" fill="#8bd3ff" stroke="#24283b" stroke-width="5"/>
    <text x="605" y="205" text-anchor="middle" font-size="24" fill="#10131f">CITY BUILDER</text>
    <text x="605" y="238" text-anchor="middle" font-size="20" fill="#10131f">zoning says no</text>
    <path d="M500 280 h210" stroke="#24283b" stroke-width="10" stroke-dasharray="24 18"/>

    <rect x="820" y="170" width="230" height="130" rx="18" fill="#ffd166" stroke="#24283b" stroke-width="5"/>
    <text x="935" y="220" text-anchor="middle" font-size="23" fill="#10131f">LICENSE</text>
    <text x="935" y="252" text-anchor="middle" font-size="23" fill="#10131f">GOBLIN</text>
    <text x="935" y="282" text-anchor="middle" font-size="17" fill="#10131f">counts vibes twice</text>

    <rect x="160" y="390" width="260" height="100" rx="20" fill="#b8f7d4" stroke="#24283b" stroke-width="5"/>
    <text x="290" y="433" text-anchor="middle" font-size="22" fill="#10131f">BUG HOSPITAL</text>
    <text x="290" y="462" text-anchor="middle" font-size="17" fill="#10131f">patients: defects</text>

    <rect x="500" y="385" width="250" height="105" rx="20" fill="#d6c1ff" stroke="#24283b" stroke-width="5"/>
    <text x="625" y="430" text-anchor="middle" font-size="22" fill="#10131f">AGENT CRAFT</text>
    <text x="625" y="459" text-anchor="middle" font-size="17" fill="#10131f">lifecycle: lanyard</text>

    <rect x="835" y="385" width="210" height="105" rx="20" fill="#ffb86b" stroke="#24283b" stroke-width="5"/>
    <text x="940" y="430" text-anchor="middle" font-size="22" fill="#10131f">PLAYOFF</text>
    <text x="940" y="459" text-anchor="middle" font-size="17" fill="#10131f">REFRESH FOG</text>
  </g>
  <path d="M385 225 C430 225 425 225 455 225" stroke="#24283b" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <path d="M755 230 C795 230 790 235 820 235" stroke="#24283b" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <path d="M290 390 C330 350 520 345 585 385" stroke="#24283b" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#24283b"/></marker></defs>
  <text x="600" y="555" text-anchor="middle" font-family="monospace" font-size="26" fill="#24283b">EVERYONE HAS PRIORITY. NOBODY HAS A DRIVER.</text>
</svg>