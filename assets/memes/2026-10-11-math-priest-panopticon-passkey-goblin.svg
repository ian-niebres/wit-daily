<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Sunday Internet Evidence Map</title><desc id="desc">A satirical map showing math, surveillance, passkeys, and football as internet weather.</desc><rect width="1200" height="675" fill="#14151f"/><rect x="45" y="45" width="1110" height="585" rx="32" fill="#f5efe1" stroke="#222436" stroke-width="10"/><text x="600" y="100" text-anchor="middle" font-family="Georgia,serif" font-size="42" fill="#222436">SUNDAY INTERNET EVIDENCE MAP</text><line x1="600" y1="135" x2="600" y2="575" stroke="#d65f5f" stroke-width="5" stroke-dasharray="16 12"/><line x1="160" y1="350" x2="1040" y2="350" stroke="#d65f5f" stroke-width="5" stroke-dasharray="16 12"/><g font-family="Arial,sans-serif" font-weight="700" fill="#222436"><rect x="105" y="160" width="330" height="150" rx="20" fill="#c7e2ff" stroke="#222436" stroke-width="5"/><text x="270" y="215" text-anchor="middle" font-size="30">MATH 2.0</text><text x="270" y="260" text-anchor="middle" font-size="24">priest slides</text><circle cx="390" cy="190" r="25" fill="#ffcf66"/><rect x="760" y="150" width="320" height="165" rx="20" fill="#ffd2d2" stroke="#222436" stroke-width="5"/><text x="920" y="205" text-anchor="middle" font-size="30">PASSKEY</text><text x="920" y="248" text-anchor="middle" font-size="24">TRAP GOBLIN</text><path d="M1030 178 l40 35 l-45 10 z" fill="#222436"/><rect x="110" y="405" width="330" height="145" rx="20" fill="#d8f7c3" stroke="#222436" stroke-width="5"/><text x="275" y="460" text-anchor="middle" font-size="28">WEBCAM</text><text x="275" y="502" text-anchor="middle" font-size="24">160/DAY ALTAR</text><circle cx="160" cy="455" r="32" fill="#222436"/><circle cx="160" cy="455" r="12" fill="#82d4ff"/><rect x="760" y="410" width="320" height="145" rx="20" fill="#ece0ff" stroke="#222436" stroke-width="5"/><text x="920" y="462" text-anchor="middle" font-size="28">FOOTBALL</text><text x="920" y="504" text-anchor="middle" font-size="24">BAROMETER</text><path d="M840 525 q80 -70 160 0" fill="none" stroke="#222436" stroke-width="8"/><circle cx="600" cy="350" r="105" fill="#222436"/><text x="600" y="332" text-anchor="middle" font-size="26" fill="#f5efe1">COLLECTIVE</text><text x="600" y="368" text-anchor="middle" font-size="26" fill="#f5efe1">INTELLIGENCE</text><text x="600" y="404" text-anchor="middle" font-size="22" fill="#ffcf66">please self-improve</text></g><g stroke="#222436" stroke-width="6" marker-end="url(#a)"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#222436"/></marker></defs><line x1="435" y1="235" x2="515" y2="300"/><line x1="760" y1="235" x2="685" y2="300"/><line x1="440" y1="475" x2="515" y2="405"/><line x1="760" y1="475" x2="685" y2="405"/></g><text x="600" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#222436">diagnosis: panopticon with a foam finger</text></svg>