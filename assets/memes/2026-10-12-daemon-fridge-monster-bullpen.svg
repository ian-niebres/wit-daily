<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The internet's Monday control room</title>
  <desc id="desc">A self-updating daemon, a hacked fridge, a streaming monster, and a bullpen oracle crowd around a dashboard.</desc>
  <rect width="900" height="520" rx="28" fill="#111827"/>
  <rect x="32" y="34" width="836" height="452" rx="22" fill="#f8fafc"/>
  <text x="58" y="78" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#111827">MONDAY INCIDENT DASHBOARD</text>
  <text x="58" y="111" font-family="monospace" font-size="15" fill="#6b7280">Status: every appliance has requested agent privileges</text>
  <g transform="translate(70 145)">
    <rect width="180" height="230" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="90" cy="78" r="42" fill="#60a5fa"/>
    <rect x="48" y="130" width="84" height="58" rx="10" fill="#1d4ed8"/>
