  <path d="M250 250 L285 250 M455 250 L490 250 M660 250 L695 250" stroke="#111827" stroke-width="5" stroke-dasharray="10 8"/>
  <rect x="172" y="410" width="556" height="40" rx="20" fill="#111827"/>
