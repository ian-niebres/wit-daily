    <circle cx="70" cy="102" r="8" fill="#111827"/><circle cx="100" cy="102" r="8" fill="#111827"/>
    <path d="M67 137 Q85 153 105 137" fill="none" stroke="#111827" stroke-width="4"/>
    <text x="85" y="209" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#7f1d1d">NETFLIX MONSTER</text>
  </g>
  <g transform="translate(695 145)">
