    <text x="85" y="120" text-anchor="middle" font-family="monospace" font-size="16" fill="#065f46">DEFROST</text>
    <path d="M55 198 C85 175 105 225 135 196" fill="none" stroke="#047857" stroke-width="5"/>
    <text x="85" y="218" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#065f46">FRIDGE JAILBREAK</text>
  </g>
  <g transform="translate(490 145)">
